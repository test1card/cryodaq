name: CryoDAQ protected CI evidence gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:

# A pull request converted back to draft, or pushed again, must supersede the
# matrices already running for it. Cancellation requires cancel-in-progress
# inside a shared group, so the group is declared here rather than relied on.
# The predicate is narrower than main.yml's `github.ref != master`: that is
# also true for a merge_group ref, which would let a newer queue entry cancel
# an in-flight protected run. A cancelled run fails CLOSED -- it produces no
# evidence, and the gate refuses absent evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow is configured as an organization-required workflow. GitHub
# binds its native check directly to the immutable pull-request merge candidate
# or merge-queue candidate in github.sha. Candidate workflow content is never
# executed as workflow control, and no separately-created check is authoritative.

jobs:
  protected-execution:
    name: protected execution (${{ matrix.os }}, ${{ matrix.suite }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [core, gui, agents, remaining]
    env:
      ARTIFACT_NAME: cryodaq-protected-candidate-${{ matrix.os }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
      # job is available in step contexts, not in job-level env. Keep the
      # GitHub-signed check-run identifier on the two consuming steps below.
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      JUDGE_SHA: ${{ github.workflow_sha }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      TARGET_RUN_ATTEMPT: ${{ github.run_attempt }}
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_SHA: ${{ github.sha }}
      TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Resolve immutable workflow source
        id: workflow-source
        shell: bash
        run: |
          set -euo pipefail
          workflow_ref="${GITHUB_WORKFLOW_REF:?}"
          if [[ ! "$workflow_ref" =~ ^([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)/\.github/workflows/protected-ci-evidence-gate\.yml@(refs/.+)$ ]]; then
            echo "protected workflow source reference is malformed" >&2
            exit 1
          fi
          source_repository="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          test "$source_repository" = "${GITHUB_REPOSITORY:?}"
          test -n "${BASH_REMATCH[3]}"
          [[ "${JUDGE_SHA:?}" =~ ^[0-9a-f]{40}$ ]]
          printf 'repository=%s\n' "$source_repository" >>"${GITHUB_OUTPUT:?}"

      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ env.TARGET_SHA }}

      - name: Check out immutable producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          path: judge
          persist-credentials: false
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ env.JUDGE_SHA }}

      - name: Verify immutable producer object
        working-directory: judge
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${JUDGE_SHA:?}"
          for path in \
            .gitattributes \
            .github/workflows/protected-ci-evidence-gate.yml \
            environment.yml \
            requirements-lock.txt \
            requirements-protected-ci-lock.txt \
            tools/__init__.py \
            tools/candidate_evidence.py \
            tools/check_python_compile.py \
            tools/ci_candidate_evidence.py \
            tools/ci_active_checkout_runner.py \
            tools/ci_candidate_runner.py \
            tools/ci_execution_roots.py \
            tools/ci_guard_execution.py \
            tools/ci_required_workflow_context.py \
            tools/governance_contract.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "${JUDGE_SHA:?}:$path")"
          done

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: judge/environment.yml
          channel-priority: strict

      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install immutable producer dependencies
        working-directory: judge
        run: |
          # The judge executes the candidate's suite, so its protected lock
          # intentionally contains the candidate-facing dependency set.
          python -m pip install -r requirements-protected-ci-lock.txt
          python -m pip check

      - name: Bind reviewed interpreter alias in candidate (Linux)
        if: runner.os == 'Linux'
        working-directory: candidate
        run: |
          # The git-index soak guards spawn the exact worktree .venv/bin/python
          # and prove it resolves to the interpreter executing them. The main
          # workflow binds the same alias in its own checkout; the pristine
          # candidate checkout needs it too. .venv/ is git-ignored, so the
          # exact-checkout verification stays clean.
          if [ -e .venv ] || [ -L .venv ]; then
            echo "refusing to reuse an ambient .venv for soak evidence" >&2
            exit 1
          fi
          mkdir -m 700 -p .venv/bin
          ln -s -- "$(command -v python)" .venv/bin/python
          python -c "from pathlib import Path; alias = Path('.venv/bin/python').resolve(strict=True); running = Path('/proc/self/exe').resolve(strict=True); assert alias == running, (alias, running)"

      - name: Run exact candidate with immutable producer
        id: protected-run
        continue-on-error: true
        working-directory: judge
        env:
          GITHUB_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          python -B -m tools.ci_candidate_evidence protected-run \
            --repository "${GITHUB_WORKSPACE:?}/candidate" \
            --revision "${TARGET_SHA:?}" \
            --suite "${{ matrix.suite }}" \
            --destination "${RUNNER_TEMP:?}/cryodaq-protected-candidate" \
            --output "${RUNNER_TEMP:?}/cryodaq-protected-evidence" \
            --artifact-name "${ARTIFACT_NAME:?}" \
            --producer-root "${GITHUB_WORKSPACE:?}/judge" \
            --producer-revision "${JUDGE_SHA:?}" \
            --trusted-base "${TRUSTED_BASE_SHA:?}"

      - name: Bind receipt digest to GitHub-signed job identity
        id: job-attestation
        if: always()
        working-directory: judge
        env:
          GITHUB_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          if test "${RUNNER_OS:?}" = Windows; then
            interpreter="${CONDA_PREFIX:?}/python.exe"
          else
            interpreter="${CONDA_PREFIX:?}/bin/python"
          fi
          "$interpreter" -B -m tools.ci_candidate_evidence attest-job \
            --bundle "${RUNNER_TEMP:?}/cryodaq-protected-evidence" \
            --output "${RUNNER_TEMP:?}/cryodaq-protected-evidence/job-identity-attestation.json"

      - name: Upload protected execution bundle
        id: protected-upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/cryodaq-protected-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce protected execution and identity publication
        if: always()
        run: |
          test "${{ steps.protected-run.outcome }}" = success
          test "${{ steps.job-attestation.outcome }}" = success
          test "${{ steps.protected-upload.outcome }}" = success

  protected-ci-evidence-gate:
    name: protected CI evidence gate
    needs: protected-execution
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      JUDGE_SHA: ${{ github.workflow_sha }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_RUN_ATTEMPT: ${{ github.run_attempt }}
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_SHA: ${{ github.sha }}
      TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - name: Resolve immutable workflow source
        id: workflow-source
        shell: bash
        run: |
          set -euo pipefail
          workflow_ref="${GITHUB_WORKFLOW_REF:?}"
          if [[ ! "$workflow_ref" =~ ^([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)/\.github/workflows/protected-ci-evidence-gate\.yml@(refs/.+)$ ]]; then
            echo "protected workflow source reference is malformed" >&2
            exit 1
          fi
          source_repository="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          test "$source_repository" = "${GITHUB_REPOSITORY:?}"
          test -n "${BASH_REMATCH[3]}"
          [[ "${JUDGE_SHA:?}" =~ ^[0-9a-f]{40}$ ]]
          printf 'repository=%s\n' "$source_repository" >>"${GITHUB_OUTPUT:?}"

      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ env.TARGET_SHA }}

      - name: Check out immutable judge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          path: judge
          persist-credentials: false
          repository: ${{ steps.workflow-source.outputs.repository }}
          ref: ${{ env.JUDGE_SHA }}

      - name: Verify immutable judge object
        working-directory: judge
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${JUDGE_SHA:?}"
          for path in \
            .gitattributes \
            .github/workflows/protected-ci-evidence-gate.yml \
            environment.yml \
            requirements-lock.txt \
            requirements-protected-ci-lock.txt \
            tools/__init__.py \
            tools/candidate_evidence.py \
            tools/check_python_compile.py \
            tools/ci_candidate_evidence.py \
            tools/ci_active_checkout_runner.py \
            tools/ci_candidate_runner.py \
            tools/ci_execution_roots.py \
            tools/ci_guard_execution.py \
            tools/ci_required_workflow_context.py \
            tools/governance_contract.py; do
            test "$(git hash-object "$path")" = "$(git rev-parse "${JUDGE_SHA:?}:$path")"
          done

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: judge/environment.yml
          channel-priority: strict

      - name: Install immutable judge dependencies
        working-directory: judge
        run: |
          python -m pip install -r requirements-protected-ci-lock.txt
          python -m pip check

      - name: Verify exact native required-workflow context
        id: context-proof
        continue-on-error: true
        working-directory: judge
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP:?}/cryodaq-required-context"
          python -B tools/ci_required_workflow_context.py create \
            --event-path "${GITHUB_EVENT_PATH:?}" \
            --receipt "${RUNNER_TEMP:?}/cryodaq-required-context/accepted-context.json" \
            --repo-root "${GITHUB_WORKSPACE:?}/candidate"
          python -B tools/ci_required_workflow_context.py verify \
            --event-path "${GITHUB_EVENT_PATH:?}" \
            --receipt "${RUNNER_TEMP:?}/cryodaq-required-context/accepted-context.json" \
            --repo-root "${GITHUB_WORKSPACE:?}/candidate"

      - name: Download current protected bundles and GitHub jobs
        id: protected-download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${TARGET_RUN_ID:?}" \
            --repo "${GITHUB_REPOSITORY:?}" \
            --pattern 'cryodaq-protected-candidate-*' \
            --dir "${RUNNER_TEMP:?}/cryodaq-protected-artifacts"
          gh api \
            "repos/${GITHUB_REPOSITORY:?}/actions/runs/${TARGET_RUN_ID:?}/jobs?per_page=100" \
            >"${RUNNER_TEMP:?}/cryodaq-protected-jobs.json"

      - name: Verify all GitHub-signed protected executions
        id: protected-proof
        continue-on-error: true
        working-directory: judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for os_name in ubuntu-latest windows-latest; do
            for suite in agents core gui remaining; do
              bundle="${RUNNER_TEMP:?}/cryodaq-protected-artifacts/cryodaq-protected-candidate-${os_name}-${suite}-${TARGET_RUN_ID:?}-${TARGET_RUN_ATTEMPT:?}"
              test -d "$bundle"
              python -B -m tools.ci_candidate_evidence verify-protected \
                --repository "${GITHUB_WORKSPACE:?}/candidate" \
                --producer-root "${GITHUB_WORKSPACE:?}/judge" \
                --bundle "$bundle" \
                --suite "$suite" \
                --github-repository "${GITHUB_REPOSITORY:?}" \
                --event-name "${GITHUB_EVENT_NAME:?}" \
                --source-head-sha "${SOURCE_HEAD_SHA:?}" \
                --jobs "${RUNNER_TEMP:?}/cryodaq-protected-jobs.json" \
                --target-run-id "${TARGET_RUN_ID:?}" \
                --target-run-attempt "${TARGET_RUN_ATTEMPT:?}" \
                --target-sha "${TARGET_SHA:?}" \
                --workflow-sha "${JUDGE_SHA:?}" \
                --trusted-base "${TRUSTED_BASE_SHA:?}"
            done
          done

      - name: Upload accepted required-workflow context
        id: context-upload
        if: ${{ needs.protected-execution.result == 'success' && steps.context-proof.outcome == 'success' && steps.protected-download.outcome == 'success' && steps.protected-proof.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cryodaq-accepted-context-${{ env.TARGET_RUN_ID }}-${{ env.TARGET_RUN_ATTEMPT }}
          path: ${{ runner.temp }}/cryodaq-required-context/accepted-context.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce native protected evidence gate
        if: always()
        env:
          CONTEXT_OUTCOME: ${{ steps.context-proof.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.protected-download.outcome }}
          EXECUTION_OUTCOME: ${{ needs.protected-execution.result }}
          PROTECTED_OUTCOME: ${{ steps.protected-proof.outcome }}
          UPLOAD_OUTCOME: ${{ steps.context-upload.outcome }}
        run: |
          set -euo pipefail
          test "$EXECUTION_OUTCOME" = success
          test "$CONTEXT_OUTCOME" = success
          test "$DOWNLOAD_OUTCOME" = success
          test "$PROTECTED_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
