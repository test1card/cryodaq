name: Docs Freshness Gate

# E2: mechanical doc-freshness invariants (tests/docs/test_docs_freshness.py).
# Deliberately separate from main.yml's full test matrix — this needs only
# pytest plus PyYAML, not the full cryodaq install, so it stays fast and does
# not interfere with the main CI workflow.
#
# PyYAML is required by the G4 documentation guard, which resolves
# `yaml-file::key.path` references in the adaptation documents. Resolving them
# needs a real YAML parser. The guard must NOT degrade to skipping those
# references when the parser is absent: a guard that is silently weaker in one
# partition is the same defect class this campaign exists to remove.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: docs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-freshness:
    name: docs freshness (E2)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pytest and the G4 guard's YAML parser
        run: pip install "pytest>=8" "pyyaml>=6"

      - name: Run docs freshness gate
        run: pytest tests/docs/test_docs_freshness.py -v
