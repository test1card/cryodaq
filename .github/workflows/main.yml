name: CryoDAQ CI

on:
  # Every commit on every branch (a merge to master is a push → covered too).
  push:
    branches: ["**"]
  # Every pull request into master — validates the simulated merge result.
  pull_request:
    branches: [master]
  merge_group:
  # Manual "Run workflow" button in the Actions tab.
  workflow_dispatch:
    inputs:
      trusted_base_sha:
        description: Exact 40-character commit SHA whose registered evidence is trusted
        required: true
        type: string

# If you push again before CI finishes, cancel the superseded run to save
# runner minutes — EXCEPT on master, where every mainline commit is fully
# validated (never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  test:
    needs: candidate_identity
    name: test (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    # Runner-level backstop: a native hang (Qt/C-level block) is invisible to
    # pytest's thread-method --timeout, so without this a stuck test runs to the
    # 6h default. 40 min is ~2x a healthy full run; a timeout here means "a test
    # hung" — read the faulthandler dumps in the log to find it.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [core, gui, agents, remaining]
    env:
      # Force CPython UTF-8 Mode so file I/O defaults to UTF-8 on Windows
      # (default is cp1252, which raises UnicodeError on the project's Cyrillic
      # fixtures/content). No-op on Linux/macOS. Matches the repo's UTF-8 canon.
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CANDIDATE_ARTIFACT: cryodaq-candidate-${{ matrix.os }}-${{ matrix.suite }}-${{ github.run_attempt }}
      # The one identity this lane produces evidence for. On `push` it is the pushed commit; on
      # `pull_request` GitHub's default checkout would be the EPHEMERAL MERGE COMMIT, whose SHA exists
      # only inside the run. Recording that SHA in the candidate manifest produced evidence the
      # protected judge could not bind: it resolves the manifest commit against a checkout of the PR
      # head, so `git rev-parse --verify <merge-sha>^{commit}` failed and the partition proof refused —
      # correctly. This lane therefore executes, and names, the PR head. `candidate_identity` proves
      # the synthetic merge has exactly the base and head parents and the same tree as the head,
      # refusing the run otherwise. That preserves tree-content coverage; it does not execute suites
      # against the merge commit.
      EVIDENCE_SHA: ${{ needs.candidate_identity.outputs.evidence_sha }}
      TRUSTED_BASE_SHA: ${{ needs.candidate_identity.outputs.trusted_base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.candidate_identity.outputs.evidence_sha }}

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: environment.yml
          channel-priority: strict

      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        # Bounded, because this step HUNG for the job's full 50 minutes twice on
        # 2026-08-19 and took two pull requests' evidence with it. The bound is what
        # turned that silent cancellation into a named failure, and the named failure's
        # log then gave the real cause: an unreachable Ubuntu mirror, not the dpkg lock
        # the first fix was aimed at. Keep the bound -- it is how the next stall of a
        # different kind will name itself instead of vanishing.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # THIS SCRIPT MUST NEVER CALL `exit`, AND THE REASON IS NOT STYLE.
          # This job's shell is `bash -el {0}` -- a LOGIN shell -- and the runner starts
          # it directly, so SHLVL is 1. That is the exact condition under which
          # ~/.bash_logout runs its `clear_console` line, and `clear_console` FAILS when
          # there is no terminal. Its status then replaces the argument of an explicit
          # `exit`. Measured on Ubuntu: from such a shell `exit 0` reports 1, while
          # falling off the end reports 0. Run 32306229771 lost ALL FOUR Linux jobs to
          # this: every one of them installed the library in about 7 seconds, printed its
          # success line, and then reported failure. So the flow below is if/else and the
          # script ends by falling off the end.
          #
          # Ask what is MISSING before touching the network. Runner images differ: in run
          # 32303335407 one job reported "missing: libegl1" and another reported nothing
          # at all, so both paths are real and both have to be bounded.
          missing=""
          for package in libegl1 libgl1 libxkbcommon0 libdbus-1-3; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -z "$missing" ]; then
            echo "Qt offscreen libraries already present; nothing to fetch"
          else
            echo "missing:$missing"
            # EVERY apt-get call below carries the same network bounds, because every one
            # of them goes to the same mirror list. Measured in run 32303335407: apt-get
            # spent 2 min 13 s trying azure.archive.ubuntu.com before ignoring it, then a
            # further 6 minutes on package indexes from archive.ubuntu.com, and hit the
            # step bound. Downloading the .deb itself can stall the same way, so bounding
            # only the index update would let the first install eat the whole budget.
            apt_options="-o DPkg::Lock::Timeout=180"
            apt_options="$apt_options -o Acquire::http::Timeout=15"
            apt_options="$apt_options -o Acquire::https::Timeout=15"
            apt_options="$apt_options -o Acquire::Retries=2"
            # Try the package index that is already on the image first. A mirror that is
            # unreachable cannot delay an install that never refreshes the index. Measured
            # in run 32306229771: this path installed libegl1 in 7 seconds where the
            # refresh-first path had spent the whole 8-minute bound and installed nothing.
            if sudo apt-get $apt_options install -y $missing; then
              echo "installed from the package index already on the image"
            else
              echo "the index on the image did not satisfy$missing; refreshing it"
              sudo apt-get $apt_options update
              sudo apt-get $apt_options install -y $missing
            fi
          fi

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify safe SQLite runtime
        run: python -c "from cryodaq.storage._sqlite import is_safe_version, sqlite_version_info; version = sqlite_version_info(); assert is_safe_version(version), version; print('SQLite', version)"

      - name: Bind H4 reviewed interpreter alias (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e .venv ] || [ -L .venv ]; then
            echo "refusing to reuse an ambient .venv for H4 evidence" >&2
            exit 1
          fi
          mkdir -m 700 -p .venv/bin
          ln -s -- "$(command -v python)" .venv/bin/python
          python -c "from pathlib import Path; alias = Path('.venv/bin/python').resolve(strict=True); running = Path('/proc/self/exe').resolve(strict=True); assert alias == running, (alias, running)"

      - name: Run active exact-checkout remaining-only guards
        id: active-remaining
        if: matrix.suite == 'remaining'
        run: |
          set -euo pipefail
          python -m tools.ci_active_checkout_runner \
            --repository "${GITHUB_WORKSPACE:?}" \
            --revision "${EVIDENCE_SHA:?}" \
            --trusted-base "${TRUSTED_BASE_SHA:?}" \
            --suite remaining \
            --basetemp "${RUNNER_TEMP:?}/cryodaq-active-remaining-pytest"

      - name: Lint
        if: matrix.suite == 'remaining'
        run: ruff check --no-cache src/ tests/

      - name: Check formatting of changed Python files
        if: matrix.suite == 'remaining'
        run: |
          set -euo pipefail
          # Reviewed debt boundary: everything changed after this commit must
          # be formatted.  Missing/squashed ancestry fails closed and requires
          # an explicit baseline migration instead of silently skipping files.
          # MUST be reachable from the default branch. The previous value
          # (db8849b573309453f25bc42adbf4b55cd0ce400b) existed only on the
          # campaign branches it was authored on and was NOT an ancestor of
          # master, so `git merge-base --is-ancestor` failed on every
          # master-based PR: the step exited 1 before reaching ruff, which is
          # why it produced no ruff output. A pinned baseline unreachable from
          # the default branch is a permanent red, not a debt boundary.
          FORMAT_BASE=f5d6434d20dffae62c9f03fbc12f68b03f48351b
          test "$(git cat-file -t "$FORMAT_BASE")" = commit
          git merge-base --is-ancestor "$FORMAT_BASE" HEAD

          changed_file="${RUNNER_TEMP:?}/cryodaq-format-${GITHUB_RUN_ID:-local}-${GITHUB_JOB:-job}.paths"
          trap 'rm -f "$changed_file"' EXIT
          git diff --name-only --diff-filter=ACMR -z "$FORMAT_BASE"...HEAD -- '*.py' >"$changed_file"

          if [[ -s "$changed_file" ]]; then
            # Bounded batches avoid the Windows CreateProcess command-line
            # limit while preserving arbitrary Git-valid path names.
            xargs -0 -n 100 python -m ruff format --check --no-cache -- <"$changed_file"
          else
            echo "No changed Python files to format-check."
          fi

      - name: Check requirements-lock drift
        if: matrix.suite == 'remaining'
        # The frozen Windows build installs transitive deps from
        # requirements-lock.txt then install with --no-deps and
        # --no-build-isolation. Any
        # top-level dep missing from the lock is absent from the bundle.
        run: python scripts/check_lock_drift.py

      - name: Run exact exported candidate suite
        id: candidate
        run: |
          python -m tools.ci_candidate_evidence run \
            --repository "${GITHUB_WORKSPACE:?}" \
            --revision "${EVIDENCE_SHA:?}" \
            --suite "${{ matrix.suite }}" \
            --destination "${RUNNER_TEMP:?}/cryodaq-candidate" \
            --output "${RUNNER_TEMP:?}/cryodaq-candidate-evidence" \
            --artifact-name "${CANDIDATE_ARTIFACT:?}"

      - name: Summarize failed exact candidate nodes
        id: candidate-failure-summary
        if: always() && steps.candidate.outcome == 'failure'
        run: |
          python -m tools.ci_candidate_evidence summarize \
            --bundle "${RUNNER_TEMP:?}/cryodaq-candidate-evidence" \
            --max-nodes 20

      - name: Upload exact candidate execution bundle
        id: candidate-upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ runner.temp }}/cryodaq-candidate-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Attest uploaded candidate artifact
        if: always() && steps.candidate-upload.outcome == 'success'
        run: |
          python -m tools.ci_candidate_evidence attest \
            --bundle "${RUNNER_TEMP:?}/cryodaq-candidate-evidence" \
            --output "${RUNNER_TEMP:?}/cryodaq-candidate-attestation/artifact-attestation.json" \
            --artifact-name "${CANDIDATE_ARTIFACT:?}" \
            --artifact-id "${{ steps.candidate-upload.outputs.artifact-id }}" \
            --artifact-digest "sha256:${{ steps.candidate-upload.outputs.artifact-digest }}"

      - name: Upload exact candidate artifact attestation
        id: candidate-attestation-upload
        if: always() && steps.candidate-upload.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}-attestation
          path: ${{ runner.temp }}/cryodaq-candidate-attestation/artifact-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exact candidate execution and evidence publication
        if: always()
        run: |
          if test "${{ matrix.suite }}" = remaining; then
            test "${{ steps.active-remaining.outcome }}" = success
          else
            test "${{ steps.active-remaining.outcome }}" = skipped
          fi
          test "${{ steps.candidate-upload.outcome }}" = success
          test "${{ steps.candidate-attestation-upload.outcome }}" = success

  candidate_identity:
    name: Bind candidate and prove PR merge-tree equivalence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      evidence_sha: ${{ steps.bind.outputs.evidence_sha }}
      trusted_base_sha: ${{ steps.bind.outputs.trusted_base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: bind
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_CREATED: ${{ github.event.created }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_TRUSTED_BASE_SHA: ${{ inputs.trusted_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          event_commit="$(git rev-parse --verify "${EVENT_SHA:?}^{commit}")"
          readonly event_commit
          require_commit() {
            local label="$1" sha="$2"
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$sha" == "0000000000000000000000000000000000000000" ]]; then
              echo "invalid $label commit SHA" >&2
              return 1
            fi
            if ! git rev-parse --verify "${sha}^{commit}" >/dev/null 2>&1; then
              # A force-pushed predecessor head is GitHub event authority but is
              # not an ancestor of the new head, so the checkout lacks the
              # object; fetch that exact commit once, then re-verify.  A SHA
              # the remote cannot serve still fails closed below.
              git fetch --no-tags origin "${sha}" >&2 || true
            fi
            if ! git rev-parse --verify "${sha}^{commit}" >/dev/null; then
              echo "unresolvable $label commit SHA: $sha" >&2
              return 1
            fi
            printf '%s' "$sha"
          }
          if [[ "${EVENT_NAME:?}" == "pull_request" ]]; then
            readonly merge_commit="$event_commit"
            base_commit="$(git rev-parse --verify "${PR_BASE_SHA:?}^{commit}")"
            readonly base_commit
            head_commit="$(git rev-parse --verify "${PR_HEAD_SHA:?}^{commit}")"
            readonly head_commit
            read -r recorded first_parent second_parent extra \
              <<<"$(git rev-list --parents -n 1 "$merge_commit")"
            test "$recorded" = "$merge_commit"
            test "$first_parent" = "$base_commit"
            test "$second_parent" = "$head_commit"
            test -z "${extra:-}"
            # This conditional waiver trips on tree divergence, not on whether master advanced:
            # only identical trees prove the PR-head execution covers the synthetic merge tree.
            merge_tree="$(git rev-parse --verify "${merge_commit}^{tree}")"
            readonly merge_tree
            head_tree="$(git rev-parse --verify "${head_commit}^{tree}")"
            readonly head_tree
            if [[ "$merge_tree" != "$head_tree" ]]; then
              echo "::error::PR merge tree $merge_tree differs from executed head tree $head_tree." \
                "Update the PR branch onto master to restore tree equality, or implement a merge-validation lane."
              exit 1
            fi
            readonly evidence_sha="$head_commit"
            trusted_base_sha="$(require_commit 'pull request base' "${PR_BASE_SHA:?}")"
            readonly trusted_base_sha
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            readonly evidence_sha="$event_commit"
            trusted_base_sha="$(require_commit 'merge-group base' "${MERGE_GROUP_BASE_SHA:?}")"
            readonly trusted_base_sha
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "${PUSH_CREATED:-false}" == true ]]; then
              test "${PUSH_BEFORE:?}" = "0000000000000000000000000000000000000000"
              test -n "${DEFAULT_BRANCH:?}"
              git fetch --no-tags origin "${DEFAULT_BRANCH}"
              default_tip="$(git rev-parse --verify "origin/${DEFAULT_BRANCH}^{commit}")"
              mapfile -t bases < <(git merge-base --all "$event_commit" "$default_tip")
              test "${#bases[@]}" = 1
              trusted_base_sha="$(require_commit 'creation-push merge base' "${bases[0]}")"
            else
              test "${PUSH_BEFORE:?}" != "0000000000000000000000000000000000000000"
              trusted_base_sha="$(require_commit 'push before' "${PUSH_BEFORE}")"
            fi
            readonly trusted_base_sha
            readonly evidence_sha="$event_commit"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            readonly evidence_sha="$event_commit"
            trusted_base_sha="$(require_commit 'workflow-dispatch trusted base' "${DISPATCH_TRUSTED_BASE_SHA:?}")"
            readonly trusted_base_sha
          else
            echo "unsupported evidence authority event: $EVENT_NAME" >&2
            exit 1
          fi
          printf 'evidence_sha=%s\n' "$evidence_sha" >>"$GITHUB_OUTPUT"
          printf 'trusted_base_sha=%s\n' "$trusted_base_sha" >>"$GITHUB_OUTPUT"
