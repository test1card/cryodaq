name: CryoDAQ Nightly

# Nightly-only CI (roadmap D4 + B-phase-exit "72h mock soak (nightly CI job)
# clean"). Kept out of main.yml on purpose: these lanes are heavier/longer
# than the per-push suite and their failures are loud-but-async, not a merge
# gate. workflow_dispatch is enabled so failures can be re-run/investigated
# on demand; surfacing is GitHub-native (Actions tab / email), no Telegram
# wiring from CI.

on:
  schedule:
    # 03:17 UTC — an off-the-hour minute avoids the GitHub Actions
    # top-of-hour cron thundering herd.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golden-replay:
    name: golden-run replay regression (D4)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: environment.yml
          channel-priority: strict

      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        # Bounded, because this step HUNG for the job's full 50 minutes twice on
        # 2026-08-19 and took two pull requests' evidence with it. The bound is what
        # turned that silent cancellation into a named failure, and the named failure's
        # log then gave the real cause: an unreachable Ubuntu mirror, not the dpkg lock
        # the first fix was aimed at. Keep the bound -- it is how the next stall of a
        # different kind will name itself instead of vanishing.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # THIS SCRIPT MUST NEVER CALL `exit`, AND THE REASON IS NOT STYLE.
          # This job's shell is `bash -el {0}` -- a LOGIN shell -- and the runner starts
          # it directly, so SHLVL is 1. That is the exact condition under which
          # ~/.bash_logout runs its `clear_console` line, and `clear_console` FAILS when
          # there is no terminal. Its status then replaces the argument of an explicit
          # `exit`. Measured on Ubuntu: from such a shell `exit 0` reports 1, while
          # falling off the end reports 0. Run 32306229771 lost ALL FOUR Linux jobs to
          # this: every one of them installed the library in about 7 seconds, printed its
          # success line, and then reported failure. So the flow below is if/else and the
          # script ends by falling off the end.
          #
          # Ask what is MISSING before touching the network. Runner images differ: in run
          # 32303335407 one job reported "missing: libegl1" and another reported nothing
          # at all, so both paths are real and both have to be bounded.
          missing=""
          for package in libegl1 libgl1 libxkbcommon0 libdbus-1-3; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -z "$missing" ]; then
            echo "Qt offscreen libraries already present; nothing to fetch"
          else
            echo "missing:$missing"
            # EVERY apt-get call below carries the same network bounds, because every one
            # of them goes to the same mirror list. Measured in run 32303335407: apt-get
            # spent 2 min 13 s trying azure.archive.ubuntu.com before ignoring it, then a
            # further 6 minutes on package indexes from archive.ubuntu.com, and hit the
            # step bound. Downloading the .deb itself can stall the same way, so bounding
            # only the index update would let the first install eat the whole budget.
            apt_options="-o DPkg::Lock::Timeout=180"
            apt_options="$apt_options -o Acquire::http::Timeout=15"
            apt_options="$apt_options -o Acquire::https::Timeout=15"
            apt_options="$apt_options -o Acquire::Retries=2"
            # Try the package index that is already on the image first. A mirror that is
            # unreachable cannot delay an install that never refreshes the index. Measured
            # in run 32306229771: this path installed libegl1 in 7 seconds where the
            # refresh-first path had spent the whole 8-minute bound and installed nothing.
            if sudo apt-get $apt_options install -y $missing; then
              echo "installed from the package index already on the image"
            else
              echo "the index on the image did not satisfy$missing; refreshing it"
              sudo apt-get $apt_options update
              sudo apt-get $apt_options install -y $missing
            fi
          fi

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify safe SQLite runtime
        run: python -c "from cryodaq.storage._sqlite import is_safe_version, sqlite_version_info; version = sqlite_version_info(); assert is_safe_version(version), version; print('SQLite', version)"

      - name: Golden replay lane
        # Selects by marker (not path) so any future golden-marked test
        # anywhere under tests/ is picked up automatically.
        run: pytest tests/ -m golden -v --tb=short

  mock-soak:
    name: bounded mock soak (B-phase-exit)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: environment.yml
          channel-priority: strict

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify safe SQLite runtime
        run: python -c "from cryodaq.storage._sqlite import is_safe_version, sqlite_version_info; version = sqlite_version_info(); assert is_safe_version(version), version; print('SQLite', version)"

      - name: Bounded mock soak
        # CI-feasible bounded window, NOT the literal 72h from the roadmap —
        # GitHub-hosted runners cap a job at 6h. The lab runs the identical
        # driver with --duration 259200 (72h) for the real B-phase-exit soak;
        # this job is the nightly regression check for the same code path.
        run: python -m scripts.soak_mock_engine --duration 1500 --grace 30
        timeout-minutes: 35

  mock-stack-short-soak:
    name: short mock-stack soak (evidence)
    # The WHOLE-STACK soak driver, distinct from the mock-ENGINE soak above.
    # Linux only, by the driver's own contract: _PosixSoakRunner.require_platform()
    # demands signal.pthread_sigmask, and EXACT_SIX_COMMAND is pinned to
    # ".venv/bin/python".
    #
    # This job makes the SHORT profile leave a receipt. It does NOT make the 12h
    # or 72h profiles reachable: the CLI refuses every profile except short by
    # deliberate activation gating, and this job does not touch that.
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: environment.yml
          channel-priority: strict

      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        # Bounded, because this step HUNG for the job's full 50 minutes twice on
        # 2026-08-19 and took two pull requests' evidence with it. The bound is what
        # turned that silent cancellation into a named failure, and the named failure's
        # log then gave the real cause: an unreachable Ubuntu mirror, not the dpkg lock
        # the first fix was aimed at. Keep the bound -- it is how the next stall of a
        # different kind will name itself instead of vanishing.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # THIS SCRIPT MUST NEVER CALL `exit`, AND THE REASON IS NOT STYLE.
          # This job's shell is `bash -el {0}` -- a LOGIN shell -- and the runner starts
          # it directly, so SHLVL is 1. That is the exact condition under which
          # ~/.bash_logout runs its `clear_console` line, and `clear_console` FAILS when
          # there is no terminal. Its status then replaces the argument of an explicit
          # `exit`. Measured on Ubuntu: from such a shell `exit 0` reports 1, while
          # falling off the end reports 0. Run 32306229771 lost ALL FOUR Linux jobs to
          # this: every one of them installed the library in about 7 seconds, printed its
          # success line, and then reported failure. So the flow below is if/else and the
          # script ends by falling off the end.
          #
          # Ask what is MISSING before touching the network. Runner images differ: in run
          # 32303335407 one job reported "missing: libegl1" and another reported nothing
          # at all, so both paths are real and both have to be bounded.
          missing=""
          for package in libegl1 libgl1 libxkbcommon0 libdbus-1-3; do
            dpkg -s "$package" >/dev/null 2>&1 || missing="$missing $package"
          done
          if [ -z "$missing" ]; then
            echo "Qt offscreen libraries already present; nothing to fetch"
          else
            echo "missing:$missing"
            # EVERY apt-get call below carries the same network bounds, because every one
            # of them goes to the same mirror list. Measured in run 32303335407: apt-get
            # spent 2 min 13 s trying azure.archive.ubuntu.com before ignoring it, then a
            # further 6 minutes on package indexes from archive.ubuntu.com, and hit the
            # step bound. Downloading the .deb itself can stall the same way, so bounding
            # only the index update would let the first install eat the whole budget.
            apt_options="-o DPkg::Lock::Timeout=180"
            apt_options="$apt_options -o Acquire::http::Timeout=15"
            apt_options="$apt_options -o Acquire::https::Timeout=15"
            apt_options="$apt_options -o Acquire::Retries=2"
            # Try the package index that is already on the image first. A mirror that is
            # unreachable cannot delay an install that never refreshes the index. Measured
            # in run 32306229771: this path installed libegl1 in 7 seconds where the
            # refresh-first path had spent the whole 8-minute bound and installed nothing.
            if sudo apt-get $apt_options install -y $missing; then
              echo "installed from the package index already on the image"
            else
              echo "the index on the image did not satisfy$missing; refreshing it"
              sudo apt-get $apt_options update
              sudo apt-get $apt_options install -y $missing
            fi
          fi

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify safe SQLite runtime
        run: python -c "from cryodaq.storage._sqlite import is_safe_version, sqlite_version_info; version = sqlite_version_info(); assert is_safe_version(version), version"

      # Same alias binding main.yml uses for H4 evidence. The stack driver pins
      # EXACT_SIX_COMMAND to ".venv/bin/python", so that path must exist and must
      # BE the conda interpreter -- not a second environment with its own
      # site-packages, which would run the soak against different bytes than the
      # ones this job installed and verified above.
      - name: Bind the reviewed interpreter alias
        run: |
          if [ -e .venv ] || [ -L .venv ]; then
            echo "refusing to reuse an ambient .venv for soak evidence" >&2
            exit 1
          fi
          mkdir -m 700 -p .venv/bin
          ln -s -- "$(command -v python)" .venv/bin/python
          python -c "from pathlib import Path; alias = Path('.venv/bin/python').resolve(strict=True); running = Path('/proc/self/exe').resolve(strict=True); assert alias == running, (alias, running)"

      - name: Run short mock-stack soak
        # Timeout on the STEP, not the job, so a soak that overruns still leaves
        # the upload step below a budget to run in. A job-level timeout cancels
        # the whole job and the evidence goes with it.
        timeout-minutes: 30
        run: |
          mkdir -p artifacts/mock-stack-soak
          .venv/bin/python -m scripts.soak_mock_stack \
            --profile short \
            --evidence-dir "artifacts/mock-stack-soak/${GITHUB_SHA}"

      - name: Upload short-soak evidence
        # Unconditional: a failed or timed-out run still leaves the summary and
        # logs that say why. The name carries the run ATTEMPT because a re-run
        # keeps the same run id and SHA, and a colliding artifact name would
        # either fail the upload or hide which attempt produced the evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-stack-short-soak-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/mock-stack-soak/
          if-no-files-found: error
          retention-days: 14
