name: CryoDAQ Nightly

# Nightly-only CI (roadmap D4 + B-phase-exit "72h mock soak (nightly CI job)
# clean"). Kept out of main.yml on purpose: these lanes are heavier/longer
# than the per-push suite and their failures are loud-but-async, not a merge
# gate. workflow_dispatch is enabled so failures can be re-run/investigated
# on demand; surfacing is GitHub-native (Actions tab / email), no Telegram
# wiring from CI.

on:
  schedule:
    # 03:17 UTC — an off-the-hour minute avoids the GitHub Actions
    # top-of-hour cron thundering herd.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  golden-replay:
    name: golden-run replay regression (D4)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: environment.yml
          channel-priority: strict

      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify safe SQLite runtime
        run: python -c "from cryodaq.storage._sqlite import is_safe_version, sqlite_version_info; version = sqlite_version_info(); assert is_safe_version(version), version; print('SQLite', version)"

      - name: Golden replay lane
        # Selects by marker (not path) so any future golden-marked test
        # anywhere under tests/ is picked up automatically.
        run: pytest tests/ -m golden -v --tb=short

  mock-soak:
    name: bounded mock soak (B-phase-exit)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: environment.yml
          channel-priority: strict

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify safe SQLite runtime
        run: python -c "from cryodaq.storage._sqlite import is_safe_version, sqlite_version_info; version = sqlite_version_info(); assert is_safe_version(version), version; print('SQLite', version)"

      - name: Bounded mock soak
        # CI-feasible bounded window, NOT the literal 72h from the roadmap —
        # GitHub-hosted runners cap a job at 6h. The lab runs the identical
        # driver with --duration 259200 (72h) for the real B-phase-exit soak;
        # this job is the nightly regression check for the same code path.
        run: python -m scripts.soak_mock_engine --duration 1500 --grace 30
        timeout-minutes: 35

  mock-stack-short-soak:
    name: short mock-stack soak (evidence)
    # The WHOLE-STACK soak driver, distinct from the mock-ENGINE soak above.
    # Linux only, by the driver's own contract: _PosixSoakRunner.require_platform()
    # demands signal.pthread_sigmask, and EXACT_SIX_COMMAND is pinned to
    # ".venv/bin/python".
    #
    # This job makes the SHORT profile leave a receipt. It does NOT make the 12h
    # or 72h profiles reachable: the CLI refuses every profile except short by
    # deliberate activation gating, and this job does not touch that.
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: cryodaq
          environment-file: environment.yml
          channel-priority: strict

      - name: Install Qt offscreen system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify safe SQLite runtime
        run: python -c "from cryodaq.storage._sqlite import is_safe_version, sqlite_version_info; version = sqlite_version_info(); assert is_safe_version(version), version"

      # Same alias binding main.yml uses for H4 evidence. The stack driver pins
      # EXACT_SIX_COMMAND to ".venv/bin/python", so that path must exist and must
      # BE the conda interpreter -- not a second environment with its own
      # site-packages, which would run the soak against different bytes than the
      # ones this job installed and verified above.
      - name: Bind the reviewed interpreter alias
        run: |
          if [ -e .venv ] || [ -L .venv ]; then
            echo "refusing to reuse an ambient .venv for soak evidence" >&2
            exit 1
          fi
          mkdir -m 700 -p .venv/bin
          ln -s -- "$(command -v python)" .venv/bin/python
          python -c "from pathlib import Path; alias = Path('.venv/bin/python').resolve(strict=True); running = Path('/proc/self/exe').resolve(strict=True); assert alias == running, (alias, running)"

      - name: Run short mock-stack soak
        # Timeout on the STEP, not the job, so a soak that overruns still leaves
        # the upload step below a budget to run in. A job-level timeout cancels
        # the whole job and the evidence goes with it.
        timeout-minutes: 30
        run: |
          mkdir -p artifacts/mock-stack-soak
          .venv/bin/python -m scripts.soak_mock_stack \
            --profile short \
            --evidence-dir "artifacts/mock-stack-soak/${GITHUB_SHA}"

      - name: Upload short-soak evidence
        # Unconditional: a failed or timed-out run still leaves the summary and
        # logs that say why. The name carries the run ATTEMPT because a re-run
        # keeps the same run id and SHA, and a colliding artifact name would
        # either fail the upload or hide which attempt produced the evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-stack-short-soak-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/mock-stack-soak/
          if-no-files-found: error
          retention-days: 14
