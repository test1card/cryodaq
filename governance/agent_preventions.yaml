  - id: ARCHIVE-BUDGET-CHARGES-ONLY-WHAT-IT-PERSISTS-327
    status: open
    scope: product_contract
    authority_source: docs/OPEN_CELLS.md#oc-024
    applies_to: Every finalisation row charged against the retained-byte accumulator that bounds experiment finalisation memory.
    classification: silent_failure
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: The 32 MiB accumulator is what stands between a large experiment and memory exhaustion, and a bound computed from values the row does not persist is wrong in the direction that TRUNCATES DATA EARLY. A legacy descriptor is filtered out of the row but reaches `_retained_row_bytes` unfiltered, so roughly 200 bytes per row are charged for identity written as empty cells - a long finalisation then retains and writes FEWER rows than the bound permits and reports truncation the operator did not cause. This is the mirror of ARCHIVE-FINALISATION-IDENTITY-DISCARDED-318, which covers discarding declared identity and UNDER-charging for identity that IS retained; neither consequence nor invariant there reaches over-charging.
    invariant: 'The retained-byte charge for a row equals the bytes that row actually persists: `_retained_identity` filters a legacy descriptor to None BEFORE `_retained_row_bytes` sees it, and the loader passes the filtered value, so a row whose identity cells are written empty is charged nothing for them.'
    rule_refs:
      - AGENTS.md#primary-ai-first-rule-mistake-to-enforcement
      - docs/adr/003-governance-as-enforcement.md#enforcement-registry
    guards:
      - node: tests/core/test_experiment_archive_loader_identity.py::test_the_loader_charges_nothing_for_a_legacy_row
        ci_partition: core
    red_evidence: the_legacy_filter_runs_before_the_call_so_passing_an_unfiltered_legacy_descriptor_to_retained_row_bytes_charges_for_identity_the_row_writes_as_empty_cells_and_no_node_asserted_the_charge_matches_what_is_persisted_2026_08_06_pending_immutable_capture
    green_evidence: pending
  - id: ARCHIVE-SYNTHETIC-LEGACY-IDENTITY-PERSISTED-331
    status: open
    scope: product_contract
    authority_source: docs/OPEN_CELLS.md#oc-024
    applies_to: Every finalisation row whose archived reading predates the descriptor catalog.
    classification: silent_failure
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: Unattributable history is rendered as descriptor-backed. This is the OPPOSITE failure to ARCHIVE-FINALISATION-IDENTITY-DISCARDED-318 and is independently reproducible - that record covers DISCARDING identity that exists, this one covers PERSISTING an identity that does not. The bounded readers never report absence as None - `_read_sqlite_bounded` and `_read_parquet_bounded` call `resolve_legacy_descriptor` whenever the stored hash is NULL - so a pre-catalog row arrives as a synthetic legacy=True descriptor whose channel_id is `legacy:<digest OF THE CHANNEL SPELLING>` and whose hash is derived from that same spelling. Writing it puts the inference this row exists to remove into the column that exists to distinguish declaration from spelling.
    invariant: 'A descriptor marked legacy is treated as ABSENT at the finalisation boundary: the loader filters it to None before the row dict is built, so the identity cells are written empty rather than carrying a manufactured value. `legacy` is already the repository-wide marker for absent identity - reporting/sections.py::_reading_series_key and ::_visible_quantity both refuse it - and the finalisation loader agrees with them rather than inventing a second convention.'
    rule_refs:
      - AGENTS.md#primary-ai-first-rule-mistake-to-enforcement
      - docs/adr/003-governance-as-enforcement.md#enforcement-registry
    guards:
      - node: tests/core/test_experiment_archive_loader_identity.py::test_a_pre_catalog_row_arrives_with_no_identity_rather_than_a_synthetic_one
        ci_partition: core
      - node: tests/core/test_experiment_archive_loader_identity.py::test_the_reader_really_does_synthesize_a_legacy_descriptor_here
        ci_partition: core
      - node: tests/core/test_experiment_archive_descriptors.py::test_a_row_without_a_descriptor_stays_empty_and_is_not_inferred
        ci_partition: core
    red_evidence: dropping_ONLY_the_legacy_as_absent_filter_turns_1_of_the_6_loader_nodes_red_while_the_loader_carry_itself_remains_intact_which_is_what_makes_this_independently_reproducible_from_318_measured_on_89c2da8d_2026_08_06_pending_immutable_capture
