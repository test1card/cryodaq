    red_evidence: >-
      TWO PRODUCT DEFECTS of one shape, both found by review, both needing NO hostile code -- a mutable PyYAML
      table inherited by reference meant a third party decided what a lab profile executes.
      (1) yaml_constructors: a host that had called yaml.SafeLoader.add_constructor registered a side-effecting
      constructor for the standard string tag; it deleted a victim file while an operator profile was validated,
      and the identity check that the two tables were the same object was true. The parse then failed.
      (2) yaml_implicit_resolvers, WORSE: PyYAML calls each registered matcher while scanning every scalar, so a
      resolver added through the ordinary add_implicit_resolver API deleted a victim file while the profile parsed
      SUCCESSFULLY -- no error, no signal. Both tables are now owned and rebuilt rather than inherited, with
      unknown tags failing closed and matchers required to be genuine compiled patterns.
      A third, smaller incumbent mutation: the CLI permanently retuned the host stdout/stderr encoding when run
      in-process; it now restores what it changed.
      Guard-side escapes are recorded on the false-green pairs, and the hostile-committer class that the static
      lint no longer claims is listed verbatim in _OUT_OF_SCOPE_FOR_STATIC_LINT with its rubric justification.
      Three follow-on variants were then reproduced against the first round of those fixes and are also closed:
      a matcher spoofing re.Pattern through __class__ passed an isinstance filter and ran during a successful
      parse, so the type check is now exact; yaml_path_resolvers was a THIRD shared mutable table, so an
      ordinary add_path_resolver call retagged nodes by position inside a profile, and it is now owned empty;
      and a host assigning ONE wrapper to both stdout and stderr defeated the stream restore, which now
      deduplicates by identity. Then a FOURTH shared table was found -- bool_values, which construct_yaml_bool
      calls through -- so a host writing yaml.SafeLoader.bool_values['true'] = 1 made schema_version: true
      validate as an integer; it is now owned. Separately, CLI diagnostics echoed attacker-influenced path and
      YAML-snippet text unescaped, so a filename containing a newline printed a standalone
      'actuation_supported: false' line indistinguishable from this tool's real boundary status -- a forged
      authoritative claim, now collapsed to one line. Finally, COPYING a table proved insufficient on its own:
      a host that poisoned bool_values BEFORE the first cryodaq.lab_profile import had its value copied in, so
      schema_version: true still validated as 1. Identity separation only blocks mutation that happens after
      import; the boolean table is now written out literally and the ordering is exercised in a fresh process,
      because an in-process test can only ever reach the easy ordering. The same pre-import ordering then
      surfaced a FIFTH dependency: construct_yaml_float reads the inherited inf_value and nan_value class
      attributes, so a host setting yaml.SafeLoader.inf_value = 1 made schema_version: .inf validate as the
      integer 1. No field in the schema accepts a float, so the float constructor is removed outright rather
      than owned, which eliminates the dependency instead of relocating it. Finally, FILTERING the inherited
      resolver table proved insufficient: an exact type check accepts a genuine compiled pattern, so a
      catastrophically backtracking regex registered before the first import was copied in and a 31-character
      scalar pushed validation past four seconds -- a breach of the bounded-parse contract, not merely a
      mis-resolution. The resolver table is now BUILT from linear-time patterns defined in the package, so no
      host state is carried across at all. Two further inherited-state items followed: DEFAULT_SCALAR_TAG and
      its sequence/mapping siblings decide what an untagged node becomes, and a host setting the scalar default
      to the int tag before the first import made every scalar parse as an integer, breaking validation of
      ordinary documents; all three are now owned. Separately the bounded-time guard was VACUOUS: it exercised
      only a foreign resolver the loader no longer installs, and its adversarial scalars were QUOTED, which is
      never implicitly resolved, so it passed against a deliberately catastrophic package-owned _INT_PATTERN.
      It now uses plain scalars keyed to each owned resolver and was verified to hang on that mutant.
      A seventh inherited mutable then surfaced: yaml.parser.Parser.DEFAULT_TAGS, the tag-handle map that
      expands the ! and !! shorthands. With DEFAULT_TAGS['!'] pointed at the yaml.org prefix before the first
      import, schema_version: !int "1" -- normally rejected as an unknown tag -- constructed as the integer 1
      and validated. It is now written out with PyYAML's own defaults. Seven inherited-state dependencies have
      now been found in this loader; the settled rule is that subclassing yaml.SafeLoader inherits its mutable
      class state and every piece must be OWNED rather than filtered, copied, or trusted. An EIGHTH then
      followed -- the scanner's ESCAPE_REPLACEMENTS and ESCAPE_CODES, where a host entry made the normally
      invalid lab_id: backslash-q validate as 'imaginary', rewriting the accepted grammar itself. Finding a
      ninth the same way is not a plan, so the rule is now enforced instead of the instances:
      test_no_inherited_pyyaml_state_is_left_unowned walks the loader's MRO and fails unless every
      non-callable inherited attribute is either owned or listed with a written reason it cannot affect
      parsing. Verified by mutation: deleting a single override fails it by name. A new PyYAML release that
      adds state, or an edit that drops an override, now fails in CI rather than in a lab. That guard was then
      itself found insufficient: it compared NAMES, so an override written as ESCAPE_CODES =
      yaml.SafeLoader.ESCAPE_CODES aliased the host object and passed while owning nothing. It now also
      requires that an owned mutable value is not the same object as the inherited one, and a companion guard
      pins the owned values against literals held in the test rather than read back from the loader, because a
      COPY of pre-poisoned state is a distinct object and would pass an identity check. That value guard was
      then ALSO found insufficient, in five separate ways in one review round, because it pinned KEY SETS
      rather than values: a constructor replaced under the same tag, a resolver added under a first character
      the test did not enumerate, ESCAPE_REPLACEMENTS["n"] rebound to a forged printable string,
      bool_values["true"] set to the integer 1 (Python mapping equality treats 1 == True, and
      `schema_version: true` then validated as version 1), and NON_PRINTABLE omitted from the check entirely
      (a never-matching pattern let a NUL truncate the stream so forbidden trailing content was ignored).
      The pin now covers the whole surface by exact value AND exact type, including which CALLABLE serves
      each tag and the complete resolver table with its pattern sources and flags. A companion guard asserts
      the resulting PARSE through the public entry point, because a structural pin describing a parse nobody
      checks proves nothing. Every one of the five holes was reproduced as a loader mutation and each is
      confirmed to turn the guards red. Review then found FOUR more, three of them in the replacement pin
      itself: (a) __module__ and __qualname__ are WRITABLE, so comparing constructors by introspection text
      passed for a replacement that spoofed both -- constructors are now compared by IDENTITY against
      SafeConstructor's own function objects, with the limitation stated in the test that identity alone is
      also insufficient because a pre-import rebinding poisons both sides at once, which is why the
      behavioural guard exists alongside it; (b) the canonicaliser used isinstance(), so a dict SUBCLASS
      delegating to yaml.SafeLoader.ESCAPE_CODES was canonicalised as an ordinary dict and the pin stayed
      green while the loader was still backed by host state -- exact types only now; (c) the bounded-parse
      probes were a hand-written list covering 7 of the 23 production resolver keys, omitting '+' and every
      upper-case key, so a catastrophic pattern reachable only from an omitted key would not have been
      exercised -- the probes are now DERIVED from the resolver table, and coverage of all 23 keys is
      measured; (d) the effect probe restored sys.argv BEFORE taking the after-snapshot, so a CLI that
      rewrote argv reported no differences at all -- argv is now compared per profile before any restore,
      and reported as its own dimension. All four were reproduced against real production and each is
      confirmed to turn its guard red.
      A further round then found the first PRODUCT defects in several rounds, and they were more serious
      than anything the guards had been arguing about. (1) parse_lab_profile called yaml.load -- an ordinary
      MODULE ATTRIBUTE looked up at call time. With yaml.load rebound to a wrapper that deleted a file and
      returned a dict, parse_lab_profile('not yaml at all') returned a valid-looking profile and the file was
      gone; every owned table was irrelevant because the strict loader was never constructed. The parse now
      runs the owned loader directly through callables bound at import time. (2) The constructor table bound
      SafeConstructor's METHODS, so a host that rebound construct_yaml_str before the first import was
      captured verbatim: a valid operator profile validated normally while the replacement deleted a file,
      and both table guards stayed green because the poisoned function was what 'the expected constructor'
      resolved to on BOTH sides. The six constructors are now DEFINED IN THIS PACKAGE, which is the only
      defence in this module that has survived every attack. (3) The effect probe fingerprinted callables by
      __module__/__qualname__, which are writable: a replacement copying both from dynamically built strings
      hashed identically and the probe reported no differences while the host yaml module had been modified.
      Callables are now encoded by code-object identity -- defining file, line, and compiled bytecode.
      All three were reproduced against real production with a clean-host control and each is confirmed to
      turn its guard red.
      One allowlist note kept deliberately: adding 'update' to the call vocabulary to accommodate the new
      constructors turned a hostile case the scan exists to REJECT green. The entry was withdrawn and the
      constructors were rewritten to build their containers with append() and subscript assignment instead.
      The lint was right and the code changed; widening an allowlist to silence a scan is how it stops
      meaning anything.
      The NEXT round found the same entry-point defect one rung lower, which is the finding that matters
      most in this record. Moving the parse off yaml.load and binding get_single_data at import time did not
      close the class: get_single_data is inherited from yaml.constructor.BaseConstructor, so a host that
      rebinds it before the first import is captured by the binding exactly as yaml.load was. Measured -- a
      replacement returned a forged profile and deleted a file while the strict grammar never ran. Fixing the
      instance without measuring the chain it called was the same mistake the data-table guard exists to
      prevent, repeated on the method chain. The loader now DEFINES get_single_data.
      RETRACTION, and this record previously published the false version: a derived guard asserts PROVENANCE
      for every callable on the loader's MRO -- each must have been compiled inside the installed PyYAML
      package or inside this repository and resolve its globals through a yaml or cryodaq namespace -- and an
      earlier version of this text claimed that "covers rungs nobody has enumerated, including ones added by a
      future PyYAML release". THAT CLAIM WAS FALSE and is withdrawn. The guard detects a foreign replacement
      present when the TEST SUITE runs; it cannot constrain the operator's process. Measured against the fixed
      tree: rebinding yaml.constructor.BaseConstructor.construct_document AFTER a completed import made
      parse_lab_profile("hello: world") return a forged profile and delete a file, with NO import ordering
      required -- easier than either case above. The guard is a DRIFT FENCE and is recorded as one; it is not
      a runtime defence and must not be cited as coverage against a hostile host.
      What this record now covers instead is the property that actually holds. The residual is accepted
      deliberately: every remaining attack of this shape requires the attacker to already execute arbitrary
      Python inside the operator's process, and such an attacker does not need YAML at all. The realistic
      threat -- an ordinary library calling yaml.SafeLoader.add_constructor or add_implicit_resolver -- is
      closed by the owned tables and is unaffected. Descending the chain is not a strategy: yaml.load ->
      get_single_data -> construct_document -> compose_document -> scanner is ONE defect class, not five.
      The guarded property is that the ACTUATION BOUNDARY DOES NOT DEPEND ON THE PARSER: schema.py re-derives
      instrument authority from BUILTIN_DRIVER_METADATA rather than trusting the parsed document, so under
      TOTAL parser compromise a forged keithley_2604b still raises ActuationBoundaryError. Measured, and
      guarded by test_actuation_boundary_survives_a_fully_compromised_parser.
      Three further defects in the same round: an explicit `!!int 0_1` validated as 1 because int() accepts
      underscores while _INT_PATTERN gates only IMPLICIT resolution -- the comment claiming such forms failed
      closed was written without being executed and was false, and the pattern is now applied in the
      constructor; the callable fingerprint still matched a replacement built as
      types.FunctionType(original.__code__, {...}), which reuses the bytecode while resolving globals
      elsewhere, so globals, defaults and closure are now encoded; and _expected_new was COMPUTED AND NEVER
      USED, so module-set growth was never reported at all -- a plain `import decimal` injected into the
      checkout left the probe reporting no differences. It is now a reported dimension with a positive
      control, its allowlist measured from a clean run rather than guessed. A dimension the report does not
      carry is not measured, however carefully it is computed.
      2026-08-04, pending immutable capture.
    green_evidence: pending
