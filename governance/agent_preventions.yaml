  - id: LAUNCHER-SHUTDOWN-RECEIPT-001
    status: open
    scope: product_contract
    authority_source: docs/adr/003-governance-as-enforcement.md#enforcement-registry
    applies_to: Launcher-owned engine shutdown on every supported operating system.
    classification: false_shutdown_success
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: Windows terminate or kill can bypass engine cleanup while process death is reported as successful shutdown.
    invariant: Launcher success requires engine-incarnation-bound global OFF, teardown, and exit receipts; a late reply remains bound to its exact request ID and transport generation until reconciled before bridge identity release. Forced death remains HOLD and permanently blocks restart or clean-exit claims, but the HOLD evidence latch must never block bounded terminate, kill, wait, stderr-reader settlement, or release of a terminal OS process handle. An unexpected exit the launcher OBSERVED, with the process handle still held and the exit code already read, is not forced death and is not held; it records the incarnation and exit code before fallible producer invalidation, settles its crashed-child readers, and takes the reviewed crash path, which retries forever except after a configuration error, whose reviewed refusal stands. If a shutdown worker remains running, the Qt health callback polls it without synchronously waiting, retains its owner and terminal process handle, and keeps restart blocked until a later poll settles it. An unexpected exit with the process handle LOST while shutdown authority is published remains HOLD, because an engine that cannot be proven dead may still be writing, and a second engine beside it would put two writers on one database. The same distinction governs a REPLACEMENT that fails to reach readiness; a replacement observed terminal is settled rather than asked for a shutdown receipt it cannot give, including when it dies between the reading and the dispatch, and a replacement that exits with the configuration-error code keeps the reviewed refusal instead of being rescheduled into the same invalid files. The configuration-error refusal latches only after owner settlement succeeds or immutable unreadable evidence proves that no later poll can make progress; a running worker and parseable unreconciled evidence remain progress-capable and keep the health callback polling. Every finished shutdown-worker result claiming an unknown outcome is parsed by one strict shared parser in BOTH shutdown paths against the exact envelope family ZmqBridge.send_command itself produces -- post-dispatch timeout, post-dispatch cancellation, lifecycle settlement carrying delivery_state and commit_state, and safe-transport variants additionally carrying error_code and retry_safe; a claim outside that family is HOLD evidence, never settled, and a recognized envelope retains its exact request-ID-and-generation identity until reconcile_late_result yields the matching LateCommandResult, with the bridge left live while any transport identity remains unresolved. Deferred replacement-settlement passes bind to the captured pending owner -- the exact worker thread, process handle, incarnation IDs, and retained transport identity -- never to the restart generation alone; they keep settling that exact owner across generation advances and stay inert once ownership has actually moved, and a failed manual stop latches its visible HOLD while scheduling exactly such an owner-bound continuation instead of stranding the pending command with zero further callbacks. A finished worker with absent, malformed unknown-outcome, or invalid concrete evidence enters stable HOLD without another settlement callback and logs each immutable diagnosis once per worker; parseable unreconciled evidence continues polling.
    rule_refs:
      - ROADMAP.md#montana-correction-programme-after-exact-object-review-2026-07-22
