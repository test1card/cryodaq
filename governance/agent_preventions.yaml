    status: open
    scope: repository
    authority_source: AGENTS.md
    applies_to: Every test fixture or double that claims a live multi-owner runtime, publishes through its queues, or crosses an incarnation-bound boundary.
    classification: lifecycle_fixture_false_green
    correction_owner: reviewer
    guard_owner: reviewer
    disposition_owner: reviewer
    consequence: A synthetic liveness shortcut can admit work without its real owners, while queue replacements or unresolved request owners can leak past a green assertion and conceal broken shutdown.
    invariant: >-
      Live means the production composition path proved the process and every
      mandatory consumer owner/start flag, open admission, a nonfatal current
      generation, and canonical incarnation. Temporary owner or queue
      replacement is restored before fixture teardown; every synthetic pending
      or outcome-unknown owner is exactly disposed through production
      reconciliation; teardown terminally closes and proves no owner, start
      proof, admission, or incarnation remains. Every channel double implements
      the production nonblocking publish method; product code carries no
      put-only test-adapter fallback. Patching is_alive or assigning incarnation
      text cannot qualify a lifecycle or queue-integration test. A test that
      invokes the production application root must explicitly relinquish the
      ordinary shared worker-admission fixture so the production root itself
      proves exclusive open, revocation, and terminal settlement.
