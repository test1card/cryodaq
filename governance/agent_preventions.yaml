    status: reopened
    scope: product_contract
    authority_source: docs/adr/003-governance-as-enforcement.md#enforcement-registry
    applies_to: Engine --force takeover, persistent lock diagnostics, any attempted incumbent-process termination, and every qualification or soak fault-injection and cleanup process signal on every supported operating system.
    classification: arbitrary_process_termination
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: A corrupt, hostile, stale, reused, group, current-process, replay, or unrelated PID can turn force mode into an arbitrary-process kill primitive; a signal resolved from a previously observed PID alone can terminate whichever unrelated process recycled that PID between authorization and delivery, and recheck evidence copied from the authorization instead of the fresh observation seals a false identity claim into sealed evidence.
    invariant: Force mode proceeds only after acquiring the exact stable kernel lock itself; stale file contents are non-authoritative, while held, replaced, or unsafe locks fail closed without process lookup or termination. Every qualification process signal requires a freshly observed full identity -- PID plus platform start identity -- equal to the previously authorized identity, refused before any signal or evidence when it differs; only that exact rechecked identity may be signaled, and recheck evidence serializes the fresh observation, never the prior authorization.
    rule_refs:
