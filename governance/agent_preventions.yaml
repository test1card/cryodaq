    status: open
    scope: product_contract
    authority_source: docs/adr/003-governance-as-enforcement.md#enforcement-registry
    applies_to: Downstream declaration artifacts that derive capability truth from the driver registry (today cryodaq.lab_profile).
    classification: instrument_authority_escape
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: A data-only downstream artifact acquires driver-construction or source authority by importing, dynamically loading, or reflecting into the authority-bearing registry while presenting itself as inert, or exercises a capability its read-only claim excludes, such as writing over an incumbent config file. An import-time write is doubly invisible because the package is imported before the incumbent-state snapshot is taken, so the guard that claims to detect incumbent mutation snapshots the already-mutated state and still reports green. Two further blind spots had the same shape. The effect guard exercised only the import path, so any side effect in __main__.py was unobserved by every test while the documented CLI still ran it; and the guard used the live repository as its mutation target, so the regression it exists to catch would have truncated the developer's real config/safety.yaml before the assertion could fail.
    invariant: >-
      Validating a lab profile must not load the driver registry, construct a driver, acquire hardware
      authority, grant actuation, or alter incumbent state. This holds against hostile DATA and against
      ordinary host behaviour, including a host that has legitimately registered YAML constructors on
      yaml.SafeLoader. The load-bearing proof is the RUNTIME EFFECT PROBE, which runs the package and the
      documented CLI in a throwaway checkout and measures every file hash, the environment, sys.path, the
      working directory, umask, scheduling state, and process/filesystem/socket capabilities via an audit
      hook, with a verified positive control per dimension. Capability truth still comes only from the
      authority-free cryodaq.drivers.capability_metadata module, and the package never loads the registry
      nor names BUILTIN_DRIVER_SPECS. The static scan is a decidable STRUCTURAL LINT over imports and the
      reflection/dunder vocabulary, indicative only about call spellings; it catches accidental coupling,
      not a hostile committer. A committer able to land arbitrary package source can also edit the guard
      or detect the probe, so that residual is out of scope per docs/OPEN_CELLS.md lines 30-36 and OC-035
      at line 112, and is controlled by review and branch protection. Do not restore interprocedural
      provenance analysis to the lint; close real escapes in the effect probe where they can be measured.
