  - id: ARCHIVE-RETAINED-BUDGET-UNDERCHARGE-335
    status: open
    scope: product_contract
    authority_source: docs/OPEN_CELLS.md#oc-024
    applies_to: Every finalisation row charged against the 32 MiB retained-byte accumulator that bounds experiment finalisation memory.
    classification: silent_failure
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: The declared identity is persisted correctly and NOT charged for, so a long finalisation retains and writes substantially more than the cap permits - the bound that stands between a large experiment and memory exhaustion. This is independent of ARCHIVE-FINALISATION-IDENTITY-DISCARDED-318 in both directions - reverting the loader carry discards identity but correctly charges nothing for identity that is then not persisted, while removing the identity terms from the accounting, or passing None only at its call site, leaves the identity in the CSV and undercharges - so neither failure can be reopened or disposed by the other.
    invariant: 'The retained-byte charge for a row includes every identity value that row persists: `_retained_row_bytes` sums the encoded lengths of channel_id, descriptor_hash and descriptor_revision, and the loader passes the filtered identity to it rather than None.'
    rule_refs:
      - AGENTS.md#primary-ai-first-rule-mistake-to-enforcement
      - docs/adr/003-governance-as-enforcement.md#enforcement-registry
    guards:
      - node: tests/core/test_experiment_archive_loader_identity.py::test_the_retained_byte_budget_charges_for_the_identity_it_retains
        ci_partition: core
      - node: tests/core/test_experiment_archive_loader_identity.py::test_the_loader_charges_the_budget_with_the_identity_it_persists
        ci_partition: core
