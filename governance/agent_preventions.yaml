  - id: CONDUCTIVITY-AUTO-EVIDENCE-AUTHORITY-081
    status: open
    scope: product_contract
    authority_source: AGENTS.md#primary-ai-first-rule-mistake-to-enforcement
    applies_to: The automatic conductivity step from an acknowledged Keithley target through sample qualification, point recording, the next target, and Stop.
    classification: evidence_misbinding
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: The automatic sweep can advance or record a conductivity point from a bridge backlog, from measurements acquired before the target acknowledgement after a wall-clock step, from temperature stability that spans a power-feed failure, or from controls rebuilt onto channels that differ from the commanded step.
    invariant: Each automatic step binds one immutable Keithley channel and one immutable temperature chain. LakeShore and Keithley readings carry a monotonic acquisition start captured before I/O, and the bridge stamps monotonic ingress before its process queue. The panel accepts only usable samples acquired after the monotonic target acknowledgement and within a freshness bound at bridge ingress that has a fail-closed floor of ten seconds, widened to three times the largest per-channel median acquisition gap when the observed cadence of the bound channels is slower. An unusable or silent selected power feed clears both power and temperature evidence plus the stability predictor. Channel-manager rebuilds preserve the bound chain and re-disable every rebuilt selector until settlement; inactive controls then reconcile to current settings. The next target and Stop use the bound Keithley channel. The panel does not advance without current qualified power and temperature evidence.
