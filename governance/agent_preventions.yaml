  - id: ALARM-NARRATION-SUPPRESSION-WITHOUT-FLOOR-304
    status: open
    scope: product_contract
    authority_source: docs/DECISIONS.md#owner-2026-08-05-a-still-active-critical-must-break-its-own-silence
    applies_to: Every suppression decision the live assistant alarm-narration ledger makes for a CRITICAL alarm_fired event.
    classification: silent_failure
    correction_owner: primary
    guard_owner: primary
    disposition_owner: reviewer
    consequence: An operator stops being told about a CRITICAL condition that is still active, and nothing in the system says so. The dedup gate refreshed its seen-timestamp on every attempt INCLUDING suppressed ones, so the quiet-for-a-full-window condition was unreachable while the alarm kept firing and a continuously flapping CRITICAL was narrated exactly ONCE for as long as it lasted. Three further holes rode on top - a narration lost to a broken transport still bought a full window of silence because production never reported a delivery outcome at all; an outcome was keyed by the alarm rather than by the attempt, so with two inferences in flight a superseded attempt's failure could re-arm an alarm a newer attempt had delivered and a superseded attempt's SUCCESS could be discarded; and cancellation of an in-flight handler bypassed every outcome report because CancelledError is a BaseException.
    invariant: 'The ledger suppresses duplicates of what the operator RECEIVED, and the interval between admissions is bounded: a failed or cancelled attempt re-arms the alarm after one window, a still-active CRITICAL is re-admitted escalate_after_s after the last CONFIRMED DELIVERY, and every outcome is scoped to the attempt that produced it and settles that attempt once. WHAT THIS RECORD DOES NOT CLAIM. (1) PARTIAL DELIVERY IS NOT PRESERVED ACROSS A CANCELLATION INSIDE THE ROUTER: with several recipients, stop() arriving between the first acknowledgement and the second means dispatch_detailed never returns, the outcome callback never fires, and the attempt settles undelivered even though one recipient was reached - so the next refire resends to them. Closing that needs per-recipient incremental reporting inside the router, which is a change to the router rather than to this ledger. (2) It bounds ADMISSIONS, not receipts. The hourly rate limit, the inference semaphore, context assembly, audit-intent persistence, generation and sequential per-recipient transport acknowledgements all sit between admission and delivery, and no end-to-end deadline spans them - so no received-to-received maximum is asserted anywhere in the code, the tests or the register. Two earlier versions of this claim did assert one and were false.'
    rule_refs:
