# Phase → analytics layout mapping (Phase III.C).
#
# Each phase defines which widget occupies the large (1/2 screen) slot
# and which two fill the right column (1/4 each). Widget IDs map to
# factories registered in src/cryodaq/gui/shell/views/analytics_widgets.py.
#
# Changes to this file do NOT require code changes — new phases can be
# added by extending the mapping (assuming the widget IDs already exist
# in the registry). Hot-reload is NOT supported; a GUI restart is
# required after editing.

phases:
  preparation:
    main: temperature_overview
    top_right: pressure_current
    bottom_right: sensor_health_summary

  vacuum:
    main: vacuum_prediction
    top_right: temperature_overview
    # 2026-09-04: was pressure_current, which duplicated the main slot —
    # vacuum_prediction already plots pressure. The molecular counter answers
    # the question the gauge cannot: is the pump actually winning? During the
    # 03.09 pump-down the pressure was flat at 5e-2 mbar for hours while the
    # chamber gained gas.
    bottom_right: gas_inventory

  cooldown:
    main: cooldown_prediction
    top_right: temperature_overview
    # 2026-09-04: was r_thermal_placeholder — a card reading "данные источника
    # ожидают (зависит от F8)" that occupied a quarter of the view for every
    # cooldown ever run. Nothing is displaced by replacing it.
    bottom_right: gas_inventory

  measurement:
    # v0.55.6.1: temperature steady-state asymptote is the headline
    # widget per architect 2026-05-07 («в фазе измерения до сих пор R,
    # а не прогноз по температуре (пусть и асимптотический)»).
    # R_thermal demoted to top_right (still useful for thermal-link
    # diagnostics), Keithley still confined to its own tab per v0.55.2.
    main: temperature_steady_state
    top_right: r_thermal_live
    bottom_right: temperature_overview

  warmup:
    main: temperature_trajectory
    top_right: pressure_current
    bottom_right: cooldown_history

  disassembly:
    main: experiment_summary
    top_right: null
    bottom_right: null

# Fallback when phase unknown or before an experiment starts.
fallback:
  main: temperature_overview
  top_right: pressure_current
  bottom_right: sensor_health_summary
