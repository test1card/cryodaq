# Конфигурация блокировок CryoDAQ
#
# ВНИМАНИЕ: изменения в этом файле влияют на безопасность криогенного оборудования.
# Любые правки должны быть согласованы с ответственным инженером и задокументированы.
#
# Структура каждой блокировки:
#   name            — уникальный идентификатор (используется в API и логах)
#   description     — текстовое описание (отображается в интерфейсе при срабатывании)
#   channel_bindings — объявленные физические привязки (instrument_id + source_key)
#   threshold       — пороговое значение
#   comparison      — оператор: ">" (больше) или "<" (меньше)
#   action          — действие: "emergency_off", "stop_source" или операторское "warning"
#   cooldown_s      — минимальный интервал между повторными срабатываниями (секунды)

interlocks:

  # ─── Температурные блокировки криостата (каналы Т1–Т8) ──────────────────────
  # Привязка использует физический источник descriptor-а, а не operator-visible
  # channel_id. Поэтому переименование идентификатора не отвяжет interlock от
  # датчика, а raw ADC-компаньоны не попадут в привязку.
  - name: "overheat_cryostat"
    description: "Перегрев криостата — аварийное отключение нагревателя"
    channel_bindings:
      - {instrument_id: "LS218_1", source_key: "input.1.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.2.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.3.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.4.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.5.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.6.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.7.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.8.temperature"}
    threshold: 350.0
    comparison: ">"
    action: "emergency_off"
    cooldown_s: 10.0

  # ─── Температурные блокировки компрессорной линии (каналы Т9–Т12) ───────────
  - name: "overheat_compressor"
    description: "Перегрев компрессорной линии"
    channel_bindings:
      - {instrument_id: "LS218_2", source_key: "input.1.temperature"}
      - {instrument_id: "LS218_2", source_key: "input.2.temperature"}
      - {instrument_id: "LS218_2", source_key: "input.3.temperature"}
      - {instrument_id: "LS218_2", source_key: "input.4.temperature"}
    threshold: 320.0
    comparison: ">"
    action: "emergency_off"
    cooldown_s: 10.0

  # ─── Верхняя граница температуры при работе источника ────────────────────────
  # Та же полная физическая привязка LS218_1, что у аварийного overheat_cryostat.
  # Порог 320 K находится выше документированного допустимого диапазона Т1–Т7
  # и остаётся ниже аварийных 350 K. Условие допускается только при активном
  # жизненном цикле источника; в idle оно остаётся ARMED.
  - name: "source_overtemp"
    description: "Температура криостата выше 320 K — остановка источника"
    channel_bindings:
      - {instrument_id: "LS218_1", source_key: "input.1.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.2.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.3.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.4.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.5.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.6.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.7.temperature"}
      - {instrument_id: "LS218_1", source_key: "input.8.temperature"}
    threshold: 320.0
    comparison: ">"
    action: "stop_source"
    cooldown_s: 10.0

  # ─── Предупреждение о рабочей температуре детектора ─────────────────────────
  # Это операторское предупреждение о качестве измерений, а не аппаратная
  # страховка: источник не отключается при Т12 > 10 K.
  # Т12 — 2-я ступень GM-cooler, на которой смонтирован детектор.
  - name: "detector_warmup"
    description: "2-я ступень (Т12) выше рабочей температуры — данные измерения могут быть недостоверны"
    channel_bindings:
      - {instrument_id: "LS218_2", source_key: "input.4.temperature"}
    threshold: 10.0
    comparison: ">"
    action: "warning"
    cooldown_s: 5.0

  # undercool_shield (Т5 < 50 K) — УДАЛЁН: ложное срабатывание при штатном cooldown.
  # Физическое обоснование: см. alarm_tz_physics_v3.md §4.2 "Undercool false alarm".

# ─── NaN-доктрина P2-5: дебаунс непригодных показаний на interlock-каналах ───
# Непригодное показание (NaN / error-status) на защищённом интерлоком канале:
#   • транзиент (одиночный blip) → CRITICAL-лог + alarm-v2, БЕЗ trip;
#   • персистентность (≥ min_samples подряд И ≥ min_duration_s) при активном
#     источнике (safety-состояние RUNNING) → эскалация в SafetyManager (FAULT).
# Mature dead interlock channels remain RUN/READY blockers while idle until usable persisted recovery.
# Обоснование: Т1–Т10 защищены ТОЛЬКО интерлоками (critical_channels — лишь
# Т11/Т12). Устойчиво мёртвый датчик на нагреваемой зоне — fail-open без этого.
nonusable_escalation:
  min_duration_s: 10.0   # минимальная длительность серии непригодных показаний
  min_samples: 5         # минимум непригодных показаний подряд
