__meta_name__: "Прохладный (наследие)"
__meta_description__: "Нейтральные серые с синеватым подтоном — состояние интерфейса до ввода переключателя тем. Для тех, кто предпочитает прежний вид."

# Surfaces (byte-identical to pre-switcher theme.py neutrals)
BACKGROUND: "#0d0e12"
SURFACE_PANEL: "#181a22"
SURFACE_CARD: "#181a22"
SURFACE_ELEVATED: "#22252f"
SURFACE_SUNKEN: "#181a22"
SURFACE_MUTED: "#1d2028"

# Borders
BORDER: "#2d3038"
BORDER_SUBTLE: "#2d3038"

# Text
FOREGROUND: "#e8eaf0"
TEXT_SECONDARY: "#8a8f9b"
MUTED_FOREGROUND: "#8a8f9b"
TEXT_DISABLED: "#555a66"

# Neutral interaction tokens (Phase III.A — decoupled from status semantics)
SELECTION_BG: "#2a2d38"
FOCUS_RING: "#5a6380"

# Accent + scale. DELIBERATELY IDENTICAL TO STATUS_INFO (owner, 2026-08-15).
# The indigo #7c8cff this replaces measured CIEDE2000 8.6 from STATUS_INFO
# #6490c4, which read as an inconsistency rather than a distinction, so the
# two are now the same colour on purpose instead of nearly the same by
# accident.
# default_cool is a PRE-ADR pack, outside _ADR_001_PACKS in
# tests/gui/test_theme_loader.py, whose >=30 degree ACCENT-to-STATUS hue rule
# would otherwise forbid this. The six ADR packs keep that separation.
# The 300/500/600 rungs are re-derived from the new base with the SAME
# saturation and value offsets, so hover and pressed do not change hue.
ACCENT: "#6490c4"
ACCENT_300: "#4d729e"
ACCENT_500: "#779ac4"
ACCENT_600: "#92a9c4"

# Text on colored backgrounds
ON_PRIMARY: "#e8eaf0"
ON_DESTRUCTIVE: "#e8eaf0"

# Status palette (LOCKED — identical across all bundled themes; one-time
# semantic refresh from v1 values, see CHANGELOG)
STATUS_OK: "#4a8a5e"
STATUS_WARNING: "#c4862e"
STATUS_CAUTION: "#c4862e"
STATUS_FAULT: "#c44545"
STATUS_INFO: "#6490c4"
STATUS_STALE: "#5a5d68"
COLD_HIGHLIGHT: "#7ab8c4"
