# F32 — RAG indexer configuration. Copy to rag.local.yaml and customize.
#
# 2026-09-05: retrieval moved off the local GTX 1050 Ti onto the owner's server
# over the NetBird overlay, alongside generation.
#
# Model choice was constrained, not free. Ollama only serves GGUF models that
# declare an `embedding` capability; the stronger 2026 embedders are not
# servable by it at all — WeMM-Embedding (25 Aug 2026) is `zh, en` only with no
# Russian, and Granite-Embedding-311M-R2 (Apr 2026, the best language fit) exists
# in Ollama as R1 only with no GGUF of R2. Beating qwen3-embedding here means
# running TEI or vLLM as a second service.
#
# embedding_dim is MEASURED, not taken from a datasheet. Published sources
# disagreed (4096 vs 7168). Since 2026-09-05 a wrong number here is refused at
# the first chunk rather than zero-filled, so it costs a second instead of an
# index — but it still has to be right, because nothing else can derive it.
# One call to /api/embed returned 4096, L2-normalised.
#
# Measured on this corpus's actual languages:
#   ru "давление в вакуумной камере" ~ en "chamber pressure"      0.814
#   ru "предел по току Keithley"     ~ en "current compliance"    0.823
#   vacuum ~ SMU (cross-topic)                                    0.49-0.62
#   anything ~ unrelated text                                     0.31-0.44
# The manuals are English and the questions are Russian, so cross-language
# matching at 0.81+ while still separating topics is the property that matters.
rag:
  ollama_base_url: "http://100.87.73.25:11437"
  # Which HTTP surface the EMBEDDING server speaks. Separate from the chat
  # model's setting in agent.yaml on purpose: the two are different servers.
  #
  # This still says ollama, and not by oversight. The operator asked on
  # 2026-09-10 for Ollama to go entirely and embeddings to move to vLLM. The
  # client can now do that -- `api: openai` posts /v1/embeddings -- but there is
  # nothing to point it at: the vLLM instance at :28001 serves only `qwen38`
  # and answers 404 on the /v1/embeddings ROUTE itself, so it was started for
  # generation alone.
  #
  # Two things must exist before this line changes:
  #   1. a SEPARATE vLLM instance serving an embedding model. vLLM runs one
  #      task per instance -- generation and pooling are different runners --
  #      so :28001 cannot also serve embeddings without giving up generation.
  #      Its literal address goes here; validate_private_llm_origin refuses
  #      hostnames and paths.
  #   2. a decision about the index, and width is NOT the test. Two embedding
  #      models can produce vectors of the same length and still occupy
  #      unrelated spaces, in which case indexer.py's width check passes and
  #      every stored vector silently means something else. Any change of
  #      `embedding_model` requires a rebuild of the corpus -- 16,118 chunks,
  #      hours of work -- and the operator owns that call.
  api: ollama
  embedding_model: "qwen3-embedding:8b"
  embedding_dim: 4096

  # Seconds for ONE embedding call. Measured on this server 2026-09-05: a
  # single /api/embed for this model takes 20-34 s, and /api/ps shows no
  # resident model, so Ollama appears to load the weights per request
  # (keep_alive did not change it). The client's 30 s default sat inside that
  # range, so chunks timed out at random and each became an unsearchable zero
  # vector — the 19:53 rebuild lost six that way before it was stopped.
  #
  # Set well clear of the measured maximum rather than just above it: too long
  # only makes a rebuild slower, too short quietly removes chunks from the
  # corpus. If the server is ever made to keep the model resident, this can
  # come back down.
  embed_timeout_s: 180.0

  # How long the server holds the embedder resident after a call.
  #
  # This was hardcoded to 0 — release immediately — which was correct when
  # retrieval ran on the local 4 GB GTX 1050 Ti, where holding the embedder
  # beside the answering model pushed generation onto the CPU. On the owner's
  # server that constraint is gone and the setting is actively expensive.
  #
  # Measured here 2026-09-05, qwen3-embedding:8b, same machine, same corpus:
  #   released after every call   20-34 s per embedding   (reloads 8B each time)
  #   held resident (this value)  0.9-1.1 s per embedding  (~25x faster)
  # /api/ps confirms 5.0 GB resident while held. Across the 16,118-chunk
  # literature corpus that is days versus hours.
  #
  # Set back to 0 if retrieval ever moves to a card that cannot hold both the
  # embedder and the answering model at once.
  #
  # That is now the case, and it is why this is 0 again. On 2026-09-10 the chat
  # model moved to vLLM, which pins its weights on the cards for as long as it
  # runs. Holding 5.0 GB of embedder resident beside it means the two elbow each
  # other for video memory on the same hardware, which the operator observed and
  # called. The 20-34 s per embedding above is the price, and it is only paid
  # when retrieval actually runs; raise it again before any RAG rebuild.
  embed_keep_alive: 0
  db_path: "data/rag_index"
  vault_dir: "~/CryoDAQ-Vault/experiments"

  # F-KnowledgeBaseExpansion (v0.55.7.1): operator-facing corpus root.
  # CLI + engine bootstrap append three sub-corpora from this folder:
  #   ${knowledge_dir}/equipment_manuals/  → PDF (page-aware chunks)
  #   ${knowledge_dir}/procedures/         → Markdown procedures
  #                                          (subdir → category;
  #                                          README.md skipped)
  #   project-root reference docs           → operator_manual,
  #                                          README, CHANGELOG (latter
  #                                          section-aware per version)
  knowledge_dir: "data/knowledge"

  # Chunking
  chunk_max_chars: 1000
  chunk_overlap: 100

  # Indexing
  table_name: "cryodaq_corpus"
