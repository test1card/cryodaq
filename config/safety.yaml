# Конфигурация системы безопасности CryoDAQ
#
# ВНИМАНИЕ: изменения в этом файле влияют на безопасность криогенного оборудования.
# Любые правки должны быть согласованы с ответственным инженером.

# Каналы, обязательные для разрешения работы нагревателя.
# Exact canonical descriptor identities. If one stops updating for
# stale_timeout_s, the safety manager faults.
#
# Правило конфигурации (2026-05-07): safety FSM используют только объявленные
# reference-каналы T11 (азотная/1-я ступень, ~40K floor) и T12
# (холодная/2-я ступень, холодная точка, ~3K floor). Их физическое крепление,
# соответствие этим ролям и калибровка пока не подтверждены; gate —
# docs/lab_verification_checklist.md. Другие T-каналы считаются
# mobile per-experiment; использование их как critical_channels создаёт
# ложные fault'ы при перестановке датчиков.
critical_channels:
  - "Т11"     # opaque canonical identity; startup resolves exact (instrument_id, emitted_channel)
  - "Т12"     # opaque canonical identity; startup resolves exact (instrument_id, emitted_channel)

# Через сколько секунд без обновления критический канал считается устаревшим
stale_timeout_s: 10.0

# Таймаут heartbeat Keithley — если нет ответа дольше, → FAULT
heartbeat_timeout_s: 15.0

# Максимальный размер очереди безопасности. Переполнение → FAULT.
max_safety_backlog: 100

# Требуется ли подключённый Keithley для перехода в RUN.
# false только для mock-режима.
require_keithley_for_run: true

# Ограничения по скорости изменения температуры
rate_limits:
  max_dT_dt_K_per_min: 5.0

# Параметры восстановления после аварии
recovery:
  require_reason: true             # оператор обязан указать причину при acknowledge
  cooldown_before_rearm_s: 60.0   # минимум 60с после аварии до повторного запуска

# Аппаратные лимиты источника тока
source_limits:
  max_power_w: 5.0
  max_voltage_v: 40.0
  max_current_a: 1.0

# Регулярные выражения для определения каналов Keithley (heartbeat check)
keithley_channels:
  - ".*/smu.*"

# Canonical descriptor identities accepted as heartbeat evidence for each
# hazardous output. Startup resolves these through the selected descriptor
# authority to exact (instrument_id, emitted_channel) pairs owned by the
# reviewed source runtime binding. Runtime code never infers an output from
# channel spelling.
keithley_heartbeat_channels:
  smua:
    - "Keithley_1/smua/voltage"
    - "Keithley_1/smua/current"
    - "Keithley_1/smua/resistance"
    - "Keithley_1/smua/power"
  smub:
    - "Keithley_1/smub/voltage"
    - "Keithley_1/smub/current"
    - "Keithley_1/smub/resistance"
    - "Keithley_1/smub/power"

# Graceful shutdown drain timeout (seconds) before forced cancellation.
# Scheduler waits this long for in-flight polls to complete persist+publish.
scheduler_drain_timeout_s: 5.0
