# Physical alarms configuration — F-X v3
# CooldownAlarm (predictor-based trajectory deviation) and VacuumGuard (P×T guard).
# All values have hard-coded fallback defaults in module if this file is missing.
# Engine restart required to apply changes (no hot-reload).

cooldown:
  enabled: true
  eval_interval_s: 30

  # Trajectory deviation alarm (predictor-based)
  k_p: 2.5                          # progress σ multiplier (2.5σ deviation)
  sustained_min: 5                  # number of consecutive ticks before fire
  base_temp_K: 5.0                  # T_cold threshold below which alarm auto-disarms
  base_epsilon_K: 1.0               # ε in "T_cold > base + ε" guard against asymptotic noise

  # ETA slip — informational message in alarm body, not fire criterion
  eta_slip_window_min: 60           # 1h lookback for slip calculation
  eta_slip_message_threshold_h: 0.5 # only mention slip if > 30 min/hour drift

  # Auto-disarm criteria
  auto_disarm_progress: 0.95

  # v0.55.4 A1: engine auto-calls arm() when an experiment transitions
  # into the cooldown phase. Operator retains manual disarm via the
  # «Контроль захолаживания» footer button on the alarm panel.
  auto_arm: true

  # Watchdog mode — activated automatically after AUTO_DISARMED (cooldown complete).
  # Monitors T_cold against a fixed threshold; fires WARNING if T_cold climbs
  # above base_temp_K + watchdog_margin_K for watchdog_sustained_s seconds.
  # Clears when operator calls disarm() or experiment is finalized.
  #
  # Architect rule (2026-05-07): post-cooldown watchdog disabled by
  # default. If the system warms back up after settling, the
  # SteadyStatePredictor exits is_quasi_steady=True, CooldownAlarm
  # WATCHING resumes the deviation check, and the regular path catches
  # it — separate watchdog logic is no longer needed for the contest
  # demo. Single config flip restores it.
  watchdog_enabled: false
  watchdog_margin_K: 1.0             # Т12 threshold = base_temp_K + this (default 6.0 K)
  watchdog_sustained_s: 300          # seconds Т12 must stay above threshold before firing
  watchdog_level: WARNING
  cold_start_skip_margin_K: 5.0

  # Channels (must match channels.yaml short IDs).
  # Declared stand mapping (not yet physically accepted):
  #   Т11 — configured as the passive plate on GM-cooler stage 1 (~40K floor)
  #   Т12 — configured as GM-cooler stage 2 / cold point (~2.9K floor)
  # Physical binding and calibration remain OPEN until recorded under
  # docs/lab_verification_checklist.md.
  cold_channel: "Т12"
  warm_channel: "Т11"

  # Predictor model location (relative to repo root or absolute)
  predictor_model_path: "data/cooldown_model/predictor_model.json"

vacuum:
  enabled: true
  eval_interval_s: 30

  # Pressure channel as published by broker (Thyracont VSP63D_1)
  pressure_channel: "VSP63D_1/pressure"

  # Reference temperature channel for arm/disarm gating
  reference_temp_channel: "Т12"
  arm_threshold_K: 260.0            # T_ref < this → arm vacuum guard
  disarm_threshold_K: 270.0         # T_ref > this → disarm (10K hysteresis)

  # 2026-09-04: the guard detects a RISE; the level is only a backstop.
  #
  # A level threshold could not separate "this stand's vacuum" from "the vacuum
  # is failing". At 1.0e-2 the guard fired 31 s after its temperature gate
  # opened, at 7.3e-2 mbar — 73x over — and every cooldown this stand has
  # recorded crossed 260 K between 7.3e-2 and 9.8e-1 mbar. It was reporting the
  # gate, not an event, and an alarm that always fires is one that gets ignored.
  #
  # Raising the level would only move the false-positive point, and if the poor
  # vacuum is water in the MLI it is temporary — a threshold detuned to this
  # stand's current floor becomes dead weight once it is dry. So the level stays
  # as a genuine emergency backstop only: 1 mbar while the cryostat is cold is a
  # catastrophe however it got there.
  fire_pressure_mbar: 1.0
  clear_pressure_mbar: 0.5
  sustained_s: 30                   # a fire condition must persist this long

  # Primary detection: fractional pressure rise, 100·d(ln P)/dt.
  #
  # Fractional, not mbar/h, because +0.001 mbar/h is catastrophic at 1e-5 mbar
  # and invisible at 5e-2 — one absolute threshold is wrong by orders of
  # magnitude at one end or the other.
  #
  # 50 %/h is derived from this stand's measured history, not chosen: across
  # 01.09-03.09 (two room-temperature pump-downs, a cooldown and a warmup) the
  # largest genuine fractional rise over a 5-minute window was +2.5 %/h. The
  # threshold is 20x above anything this stand has actually done, while a real
  # leak into a cold cryostat blows through it immediately. Recalibrate once a
  # real vacuum loss has been recorded — none has.
  fire_rise_pct_per_h: 50.0
  clear_rise_pct_per_h: 10.0
  # A slope needs a baseline in TIME. Fitted over seconds, one gauge
  # quantization step reads as tens of percent per hour: measuring this stand's
  # own history produced a spurious +71.5 %/h from a single 0.00016 mbar step
  # whose window had collapsed across a database rollover. Rates are refused
  # below half this window.
  rise_window_s: 600

  severity: CRITICAL

  # On FIRED, also latch a SafetyManager fault (source OFF + FAULT_LATCHED),
  # not just the alarm. This is opt-in; if absent, alarm-only is the default.
  # unattended/cold runs need the source killed on a vacuum incident, not
  # just an alarm. No auto-clear on pressure recovery: the latch holds
  # through FAULT_LATCHED → acknowledge → MANUAL_RECOVERY so a vacuum
  # incident while cold always needs operator eyes. Set false for
  # attended/debug runs where alarm-only (no source kill) is acceptable.
  #
  # 2026-09-03, operator policy: alarms warn, they do not de-energise the
  # source. The guard fired on the first cooldown it ever saw — P=7.2e-2 mbar
  # at Т12=259 K — and latched the Keithley. Every cooldown this stand has
  # recorded crossed 260 K between 7.3e-2 and 9.8e-1 mbar, so at
  # fire_pressure_mbar=1.0e-2 it would latch on EVERY run, and an alarm that
  # always fires is one that gets ignored. Alarm-only until the threshold is
  # recalibrated to this stand's actual distribution.
  escalate_to_safety: false

# Channel landmarks — F-ChannelLandmarks (system-level declarations).
# The tracked configuration declares Т11 / Т12 as fixed stage roles, but their
# physical attachment and calibration are not yet accepted. The query agent
# gives these configured aliases precedence over experiment-level channels.yaml
# names; that software resolution does not prove that "азотная плита" is
# physically connected to Т11. The physical gate is
# docs/lab_verification_checklist.md.
landmarks:
  Т11:
    role: warm_stage
    physical: "1-я ступень GM-cooler, ~40K при работе"
    aliases:
      - "азотная плита"
      - "плита"
      - "плита 1-й ступени"
      - "первая ступень"
      - "первая ступень GM"
      - "1-я ступень"
      - "т warm"
      - "t warm"
      - "warm channel"
  Т12:
    role: cold_stage
    physical: "2-я ступень GM-cooler, ~2.9K при работе"
    aliases:
      - "вторая ступень"
      - "вторая ступень GM"
      - "2-я ступень"
      - "холодная точка"
      - "холодный палец"
      - "т cold"
      - "t cold"
      - "cold channel"
