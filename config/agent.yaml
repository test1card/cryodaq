agent:
  enabled: true
  brand_name: "Гемма"
  brand_emoji: "🤖"

  ollama:
    base_url: http://127.0.0.1:11434
    default_model: gemma4:12b
    timeout_s: 120  # gemma4:12b thinking-first; cold-load ~9s, warm ~0.3s on RTX 5070 Ti 16GB
    temperature: 0.3
    num_ctx: 32768  # 32K context; 12b fits 100% on GPU at 8.4 GB on RTX 5070 Ti 16GB
    # Deployment notes. The 12b line is measured 2026-08-15 on the RTX 5070 Ti
    # 16GB lab PC. e4b and e2b are NO LONGER INSTALLED there, so the older
    # lines are retained only as the comparison that justifies the move:
    #   12b @ num_ctx=32768: 100% GPU, 8.4 GB used, ~56 tok/s, cold load 9.3 s,
    #     warm load 0.32 s. Faster, and smaller in vRAM, than the e4b it replaces.
    #   e4b @ num_ctx=32768: 100% GPU, ~11 GB used, ~2 GB headroom, ~39 tok/s.
    #   26b @ num_ctx=16384: 41% CPU / 59% GPU split (model 17 GB > vRAM budget),
    #     only ~680 MiB headroom, degraded throughput. Not viable on 16 GB.
    #   M5 24GB (Mac dev): e2b is not installed on the lab PC and whether it
    #     survives on the Mac is UNVERIFIED from here. Re-measure before
    #     relying on a downgrade path that names it.

  triggers:
    alarm_fired:
      enabled: true
      min_level: WARNING
    experiment_finalize:
      enabled: true
    sensor_anomaly_critical:
      enabled: true
    shift_handover_request:
      enabled: true
    # phase_transition_to_finalize: reserved — AssistantConfig.from_dict
    # (agents/assistant/live/agent.py) does not read this trigger; kept
    # commented so it isn't mistaken for a live setting.
    #   enabled: true
    periodic_report:
      enabled: true
      interval_minutes: 60
      skip_if_idle: true
      min_events_for_dispatch: 1

  outputs:
    telegram: true
    operator_log: true
    gui_insight_panel: true

  rate_limit:
    max_calls_per_hour: 60
    max_concurrent_inferences: 2

  query:
    enabled: true
    intent_model: gemma4:12b
    format_model: gemma4:12b
    intent_temperature: 0.1
    format_temperature: 0.3
    intent_timeout_s: 60.0  # absorbs 12b cold-load (9.3 s measured) + intent generation
    format_timeout_s: 90.0  # absorbs 12b cold-load + Russian format generation
    rate_limit:
      max_queries_per_chat_per_hour: 60

  slices:
    a_notification: true
    b_suggestion: true
    c_campaign_report: true

  audit:
    enabled: true
    retention_days: 90
