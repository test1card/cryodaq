agent:
  enabled: true
  brand_name: "РМКПшка"
  brand_emoji: "🤖"

  ollama:
    # Moved off the local GTX 1050 Ti on 2026-09-05, onto the owner's server
    # reached over the NetBird overlay (100.64.0.0/10, RFC 6598 shared space —
    # not routable on the public internet, reachable only from inside the
    # authenticated WireGuard mesh). `validate_private_llm_origin` enforces
    # that range and loopback, and nothing else.
    # vLLM, Qwen 3.8 Flash Next. Switched 2026-09-10 on the operator's
    # instruction: keeping both back-ends live meant the chat model and the
    # embedder were elbowing each other for video memory on the same cards.
    #
    # The LITERAL address, not `work-pc`: validate_private_llm_origin refuses
    # hostnames on purpose, so that whoever answers DNS cannot repoint the
    # endpoint at something else. It also refuses a path, so this is the bare
    # origin — the client appends /v1/chat/completions itself.
    base_url: http://100.87.73.25:28001
    default_model: qwen38
    # Which HTTP surface the endpoint speaks. "openai" is
    # /v1/chat/completions, which is ALL vLLM serves for generation: measured
    # 2026-09-09, its /api/generate, /api/chat and /api/tags all answer 404,
    # so the Ollama client cannot talk to it at all.
    api: openai
    #
    # Measured 2026-09-09 against this server: 76 tok/s against 46 on Ollama,
    # weights stay resident so there is no cold load and no hourly warm-up, and
    # the intent stage costs 0.49 s (against 578 ms on Ollama) because
    # reasoning_effort="none" is accepted there. Concurrency is capped at four
    # on the server side — a fifth request queues rather than failing.
    #
    # --- Rollback to Ollama, which is still running. Strip the leading "# "
    # --- from the three keys below and comment out the three above; they land
    # --- at the same indentation. Then do the SAME for intent_model and
    # --- format_model in the query section further down — they override
    # --- default_model, so leaving them behind points the two interactive
    # --- stages at a model the other server does not have. Five keys in
    # --- total, not three. A test performs this substitution on the real file
    # --- and parses the result, because a switch documented in a comment and
    # --- never executed is a switch that does not work.
    #
    # base_url: http://100.87.73.25:11437
    # default_model: qwen3.8:27b
    # api: ollama
    # 120 s was sized for LFM2.5-2.6B on the local card and was left behind when
    # the model changed — the first real Telegram question after the 2026-09-05
    # deploy died on it, and the operator got "Произошла внутренняя ошибка".
    #
    # It cannot cover the work this config asks for. Measured on qwen3.8:27b:
    #   generation   6144 tokens (_FORMAT_MAX_TOKENS) / 48 tok/s   = 128 s
    #   prompt eval  up to 12288 ctx (_FORMAT_NUM_CTX) / 133 tok/s =  92 s
    #   cold load    (model evicted between calls)                 =  23 s
    # so a documentation answer over retrieved manual pages can legitimately
    # need ~240 s. This is the INNERMOST bound of four, and it must stay under
    # query.format_timeout_s so the client returns a clean truncated result
    # instead of being cancelled from outside.
    #
    # 2026-09-07, operator's decision: quality over latency until the server
    # moves to vLLM with one resident MoE. Until then a good slow answer beats
    # a fast truncated one, and the measured cases were 236-290 s with one
    # question timing out entirely at 290 s. Every bound in the chain is raised
    # together, because raising one alone just moves which one cancels the work:
    #
    #   ZMQ transport 1800 > handler 1740 > format 1500 > THIS 1400
    timeout_s: 1400
    temperature: 0.3
    # 8192 was sized for the 4 GiB card; 32768 was the figure before that.
    #
    # 100000 by the operator's decision of 2026-09-07: the assistant is to hold
    # a conversation and carry an experiment's worth of context, and both need
    # room. MEASURED against 100.87.73.25:11437 before changing it — the server
    # accepts it and answered in 27.9 s, against 172.2 s at 32768 on a cold
    # load, so the larger window costs nothing here.
    num_ctx: 100000
    # Tokens ONE live-agent answer may generate, reasoning included. Separate
    # from num_ctx above, which is the window the prompt is read in.
    #
    # The hourly bulletin stopped arriving on 2026-09-11, the day the stand moved to
    # vLLM and `qwen38`, and nobody was told: report after report spent exactly 2048
    # tokens -- the whole budget, which was sized for the previous model -- on
    # reasoning and returned an EMPTY answer. Counted in the audit ledger:
    # sixteen of sixteen on 11.09, and sixteen of seventeen on 12.09.
    #
    # NOT ALL OF THEM, and a reviewer checked the ledger where I had generalised.
    # One report on 12.09, at 13:55 UTC, did arrive: 3,975 prompt tokens, 1,363 out,
    # 529 characters in 27.4 s. The failure is not a constant -- it is what happens
    # whenever the reasoning outruns the budget, which depends on the prompt (the
    # empty ones carry 3,985-4,446 prompt tokens) and on sampling. Latency on 11.09
    # ranged 40.6-93.8 s, not the uniform 40-42 s I first wrote; 12.09 was 40.0-41.6.
    #
    # Measured 2026-09-12 on the real prompt from the audit ledger, 4,041 prompt
    # tokens against this server:
    #
    #   max_tokens=2048     finish=length, out=2048, NO answer      41.6 s
    #   max_tokens=8192     finish=stop,   out=4763, 660 chars      93.2 s
    #   max_tokens=100000   finish=stop,   out=2868, 612 chars      56.9 s
    #
    # 100000 by the operator's decision of 2026-09-12: a ceiling is not spent when
    # the generation stops on its own, which the five samples at 8192 below all did
    # -- samples on today's prompts, not a guarantee, and admission, scheduling and
    # server-side queuing are not free either. What it buys is stated exactly and no
    # further: additional headroom, chosen by the operator, for a generation that
    # terminates on its own. A reviewer asked for the survivability-of-the-next-model
    # wording to go, and was right -- no future model has been measured. /v1/models reports
    # max_model_len=196608 on 2026-09-12, so prompt plus this fits -- note that
    # ollama_client.py has carried 131072 for this deployment since the switch,
    # and the two disagree; 196608 is what the server answered today.
    #
    # THIS CEILING IS NOT THE BINDING BOUND, and a reviewer corrected the note
    # that first stood here. Two bounds sit in front of it, and a third thing that
    # is often mistaken for one; measured 2026-09-12:
    #
    #   1. aiohttp's own default. `OllamaClient._get_session` builds
    #      `ClientSession()` with no timeout, and aiohttp 3.13.5 defaults to
    #      `ClientTimeout(total=300)` -- verified against the installed package.
    #      This is the one that binds: at the measured ~51 tok/s it cuts a
    #      never-stopping generation at roughly 15,300 tokens.
    #   2. ollama.timeout_s (1400 s above), which therefore never fires first.
    #   3. _PERIODIC_TICK_LEAD_S in assistant_main.py, 300 s -- NOT a bound, and
    #      a reviewer corrected that: it only schedules the tick early so the
    #      note is on disk when the chart renders, and it neither cancels nor
    #      limits the handler. A slower generation simply misses the CURRENT
    #      caption and lands in the next report.
    #
    # So what this value buys is exact and narrower than "headroom for any
    # model": a generation that stops on its own is no longer cut at 2048. It
    # does not make a 100,000-token answer reachable. Making it reachable means
    # giving the session an explicit timeout first -- which is a change to every
    # call path in that client, including alarm narration, and is queued
    # separately rather than smuggled in here.
    # 8192 for EVERY answer -- alarm narration included, and that is the part
    # that matters most. Measured 2026-09-12 on the real alarm-summary prompt
    # (system 641 + user 495 chars, a CRITICAL Т12 overtemperature):
    #
    #   max_tokens=2048   finish=length, out=2048, NO answer     40.2 s
    #   max_tokens=8192   finish=stop,   out=2802, 688 chars     55.0 s
    #
    # So the bulletin was not the only thing broken: ALARM NARRATION WAS EXPOSED TO
    # THE SAME FAILURE, and the reproduced Т12 narration was silent. That is one
    # prompt reproduced once, not a claim about every alarm -- a reviewer asked for
    # the narrower wording and was right to. No alarm has fired since 11.09, which
    # is why the audit ledger cannot say what a real one would have done.
    #
    # ALL FIVE paths that share this budget measured at 8192, same day, same
    # server. FIVE, not four: a reviewer found sensor anomaly missing from the
    # first list -- its call site shares this budget even though `_should_handle`
    # currently filters the event, so the code path exists and was measured.
    #
    #   alarm summary        out=2802   55.0 s
    #   diagnostic           out=2223   43.8 s
    #   experiment finalize  out=1968   39.3 s
    #   sensor anomaly       out=1133   22.6 s
    #   shift handover       out=5370  104.9 s   <- thinnest margin, 66% of 8192
    #
    # Each of these five ended `stop` -- on its own, inside the budget. That is
    # five samples on today's prompts and today's model, not a guarantee: the same
    # prompts at 2048 ended `length` with nothing, which is the whole reason this
    # value is here.
    #
    # Shift handover is the one to watch if this value is ever trimmed. It is NOT
    # raised to give it more room, because this ceiling is latency a newly fired
    # CRITICAL narration may wait through: `_safe_handle` holds one of two
    # inference permits around a whole handler. No figure for that wait is given
    # here -- an earlier note put it near 160 s from throughput and a reviewer
    # rightly rejected that: nothing in the code bounds it, and the per-request
    # ceiling is aiohttp's 300 s rather than any token arithmetic. Handover is not
    # time-critical; alarm narration is.
    max_tokens: 8192
    # And the BULLETIN gets the operator's headroom on its own key, because the
    # value above is shared with alarm narration and `_safe_handle` holds one of
    # only two inference permits around a whole handler. Of the paths that share
    # that budget, the bulletin is the one whose own OUTPUT is least urgent -- a
    # slow one misses its caption and lands in the next report -- which is why it
    # is the one given room. That is not the same as harmless; see below.
    #
    # WHAT THE SPLIT DOES NOT BUY. Three review rounds went on my successive
    # attempts to put a NUMBER on this, and all three were wrong, so it is stated
    # as a mechanism and not as a bound:
    #
    #   - the permit is held around the WHOLE handler, not one HTTP call, and the
    #     handler also assembles context, writes audit and dispatches;
    #   - slices.b_suggestion is TRUE here, so one successful alarm summary keeps
    #     its permit through a second, diagnostic generation;
    #   - there are two permits and the bulletin takes one of them like anything
    #     else, so a slow bulletin can make a CRITICAL narration wait.
    #
    # Nothing in the code bounds that wait, which is why no figure for it belongs
    # in a comment. What the split DOES buy is narrow and checkable: only the
    # hourly report is given the large ceiling. Isolating CRITICAL narration needs
    # priority or reserved capacity, which is a scheduling change with its own
    # review and is not attempted here.
    periodic_report_max_tokens: 100000
    # Measured 2026-09-05 against 100.87.73.25:11437, warm unless stated:
    #
    #   qwen3.8:27b   48.0 tok/s generation, 135 tok answer in 2.8 s  <- selected
    #   gemma4:31b    37.4 tok/s, but 78.8 s to load
    #   GLM-4.7-Flash 174 ms to first tokens, but answers a classification
    #                 prompt with "1. **Analyze the Request" — not usable as a
    #                 one-word classifier
    #
    # For comparison, the retired local model: LFM2.5-2.6B Q4_K_M at 40.3 tok/s
    # on the 1050 Ti. The remote 27B model generates 19% FASTER than the local
    # 2.6B one, which is why the split into a small local model and a large
    # remote one is no longer worth its complexity.
    #
    # COLD LOAD IS THE REAL COST: 23.3 s for qwen3.8:27b, 78.8 s for
    # gemma4:31b. These models are 18-81 GB and evict each other, so this
    # deployment deliberately uses ONE model for every stage. Ollama's default
    # keep_alive (5 min) then holds it between an intent call and its answer.

  triggers:
    alarm_fired:
      enabled: true
      min_level: WARNING
    experiment_finalize:
      enabled: true
    sensor_anomaly_critical:
      enabled: true
    shift_handover_request:
      enabled: true
    # phase_transition_to_finalize: reserved — AssistantConfig.from_dict
    # (agents/assistant/live/agent.py) does not read this trigger; kept
    # commented so it isn't mistaken for a live setting.
    #   enabled: true
    periodic_report:
      enabled: true
      interval_minutes: 60

  outputs:
    telegram: true
    operator_log: true
    gui_insight_panel: true

  rate_limit:
    max_calls_per_hour: 60
    max_concurrent_inferences: 2

  query:
    enabled: true
    # One model for both stages, unlike the local deployment which needed a
    # small classifier because the 4 GiB card could not hold two models.
    #
    # Intent classification is still a one-word decision and must not be paid
    # for with a reasoning trace, so the classifier sends think=false.
    # Measured 2026-09-05 on qwen3.8:27b: 578 ms warm, answering exactly
    # "status" / "history". With thinking left on, a reasoning model spent
    # 33.6 s and ~1000 tokens on that same decision and overran the 55 s
    # command envelope.
    intent_model: qwen38
    # intent_model: qwen3.8:27b
    # Same model writes the operator-facing Russian answer, with thinking ON —
    # that is the stage worth paying reasoning for, and keeping one model
    # resident avoids a 23 s reload between the two calls.
    format_model: qwen38
    # format_model: qwen3.8:27b
    intent_temperature: 0.1
    format_temperature: 0.3
    # 578 ms warm; 23.3 s if the model has been evicted. It exists to catch a
    # hung server, not to cut a working answer short — and a classification that
    # gets cut takes the whole query with it.
    intent_timeout_s: 300.0
    # A documentation answer over retrieved manual pages is the long case, and a
    # late answer still beats a truncated one. Raised with the rest of the chain
    # on 2026-09-07; see the note on ollama.timeout_s.
    format_timeout_s: 1500.0
    rate_limit:
      max_queries_per_chat_per_hour: 60

  slices:
    a_notification: true
    b_suggestion: true
    c_campaign_report: true

  audit:
    enabled: true
    retention_days: 90
