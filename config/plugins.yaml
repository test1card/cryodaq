sensor_diagnostics:
  enabled: true
  update_interval_s: 10
  noise_window_s: 120
  drift_window_s: 600
  outlier_window_s: 300
  correlation_window_s: 600
  min_points: 10
  thresholds:
    noise_cold_K: 0.02        # T < 30K (DT-670 high sensitivity zone)
    noise_mid1_K: 0.05        # 30-100K
    noise_mid2_K: 0.1         # 100-200K
    noise_warm_K: 0.2         # T > 200K
    drift_K_per_min: 0.1      # absolute drift threshold
    outlier_sigma: 5.0        # outlier = deviation > 5σ from median
    correlation_min: 0.8      # flag uncorrelated below this
    health_warning: 50
    health_critical: 30
  correlation_groups:
    shield:    [Т1, Т2, Т3, Т4, Т5, Т6, Т7, Т8]
    cold:      [Т9, Т10, Т11, Т12, Т13, Т14]
    periphery: [Т15, Т16, Т17, Т18, Т19, Т20]
  # F10 alarm publishing (sensor_diagnostics → alarm engine v2)
  alarm_publishing_enabled: true   # false → diagnostics display only, no alarms
  warning_duration_s: 300.0        # 5 min sustained anomaly → warning alarm
  critical_duration_s: 900.0       # 15 min sustained anomaly → critical alarm
  notify_telegram: false           # v0.55.5: sensor-health alarms route to GUI only;
                                    # hourly periodic_report carries condensed digest. Telegram
                                    # reserved for one-shot physics-critical events.
  cold_start_grace_s: 300.0        # v0.55.5: suppress sensor-diagnostic alarms during
                                    # the first N seconds after engine start. Buffer-fill
                                    # transients and mock reseed used to fire false anomalies
                                    # immediately on boot. Set to 0 to disable.
  # F20 notification polish
  aggregation_threshold: 3         # >N simultaneous events → single batch Telegram message
  escalation_cooldown_s: 120.0     # suppress re-notification within 2 min of last notify per channel

vacuum_trend:
  enabled: true
  # 6 h, not 1 h. A cryostat pump-down runs for days and decelerates the whole
  # way, so an hour of it looks almost flat: fitted over 1 h the model puts the
  # asymptote at essentially the current pressure (measured: p_ult = 0.267 mbar
  # while actually at 0.306 and still falling) and reports every target as
  # unreachable. A 6 h window covers enough curvature to identify tau.
  window_s: 21600                          # data window for fitting (s)
  # Pressure is still accepted every ~2 s by vacuum_trend_feed; this is only how
  # often the curve is refitted. A pump-down runs for days and its forecast does
  # not improve for being recomputed twice a minute, while the fit is the most
  # expensive analytic in the engine.
  update_interval_s: 120                   # refit interval (s)
  min_points: 60                           # minimum points for fit
  min_points_combined: 200                 # minimum for 5-param combined model
  # Targets must lie inside the gauge's range. The VSP63D is a Pirani
  # specified 1000 … 1e-4 mbar, so 1e-5 and 1e-6 were not merely far off —
  # they are below anything this sensor can report, and their ETA could never
  # be anything but "unreachable". The low-range gauge on this stand is not
  # connected to CryoDAQ, so nothing below the Pirani floor is predictable
  # here at all. 1e-4 itself is dropped too: it is the gauge's last decade,
  # where a Pirani reads its own offsets rather than the chamber. These three
  # targets sit where the reading is trustworthy and where the operator is
  # actually deciding whether the pump-down is on schedule.
  targets_mbar:
    - 1.0e-1
    - 5.0e-2
    - 1.0e-2
  # Horizons the forecast is reported at, in hours. An ETA answers "when do we
  # reach X" and goes undefined the moment X is unreachable; these answer
  # "where will we be", which is always defined.
  forecast_horizons_h: [1, 3, 6, 12, 24, 48]
  pump_start_mbar: 900.0                   # below this the chamber is being pumped
  eta_horizon_s: 1209600                   # search ETA up to 14 days ahead
  anomaly_threshold_sigma: 3.0
  rising_sustained_s: 60                   # sustained rise before "rising" flag
  trend_threshold_log10_per_s: 1.0e-4     # d(log₁₀P)/dt threshold
  # 8 × 6 h = 48 h of forecast. The operator is deciding whether a pump-down is
  # on track for a run that takes days; a 2 h projection cannot answer that.
  extrapolation_horizon_factor: 8.0       # extrapolate 8× window ahead (48 h)
  pressure_channel: ""                     # auto-detect any mbar-unit reading

cooldown_baseline:
  # Task 8a: per-cooldown fingerprint + golden-baseline comparison (backend).
  # Additive and opt-in — when disabled the cooldown-end tap is a no-op.
  enabled: false
  base_threshold_K: 5.0                     # T_cold at/below this = "at base"
  pressure_channel: "VSP63D_1/pressure"     # A2: vacuum channel read at cooldown end for ultimate_vacuum
  thresholds:
    time_to_base_frac: 0.30                 # >+30% time-to-base vs golden -> degraded
    vacuum_decades: 1.0                     # >=1 decade worse ultimate vacuum -> degraded
