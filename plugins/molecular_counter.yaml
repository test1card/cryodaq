# Счётчик молекул — сколько газа реально осталось в камере.
#
# Показывает N/N₀ в процентах от базовой линии, с поправкой на температуру газа.
# Ничего не решает и ничем не управляет: это прибор, а не регулятор.
#
# Зачем: 03.09.2026 давление падало 0.0758 → 0.0523 мбар десять часов и выглядело
# как нормальная откачка. На деле все живые датчики тоже упали до 0.70 от
# начальной температуры, и после деления на температуру газа оказалось, что
# камера НАБИРАЛА молекулы с первого часа: 80.4% на h=1, 106.6% на h=9.

pressure_channel: "VSP63D_1/pressure"

# Какие каналы представляют объём газа — свойство КОНКРЕТНОЙ сборки, а не
# стенда. Датчики переставляют, часть каналов не подключена и отдаёт константу
# или сентинел -8.888e+88. Поэтому здесь намеренно нет значения по умолчанию:
# без выбора оператора счётчик сообщает, что недоступен, и молчит.
#
# Указывайте стабильные ID каналов из channels.yaml (Т1, Т7, …), НЕ отображаемые
# имена — их редактируют, и 02.09.2026 переименование на семь часов молча
# отключило ThermalCalculator ровно по этой причине.
#
# Разумный выбор для этой сборки — датчики, сидящие на массиве образца, то есть
# те, что представляют основной объём газа, а не ступени:
#   bulk_sensors: [Т1, Т2, Т3, Т5, Т6, Т7, Т9, Т13, Т14, Т15]
bulk_sensors: []

# Величина меняется в масштабе часов; частые публикации не нужны и только
# добавляют шум. 60 с — примерно 1/30 характерного времени процесса.
update_interval_s: 60
