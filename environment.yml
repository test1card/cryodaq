name: cryodaq
channels:
  - conda-forge
dependencies:
  # Python's sqlite3 extension is linked to this pinned safe SQLite version.
  # SQLite 3.51.3 fixed the March-2026 WAL-reset corruption bug.
  # Pinned to an exact patch, not just the minor. The patch level is
  # behaviourally load-bearing here: 3.14.3 hard-crashes tests/integration.
  # Scoped provenance: workflow run 31671242175 resolved python-3.14.6 on both
  # required platforms (job 94356690790 ubuntu core, 94356690749 windows core)
  # and all five of its test jobs succeeded. That is the candidate evidence for
  # this pin. It is NOT a claim about every green check in the repository's
  # history -- PROJECT_STATUS.md records v0.64.1 CI on Python 3.13.
  - python=3.14.6
  - sqlite=3.53.2
  - pip
